# 愿望清单：看到喜欢的东西就记在这里，网页上会单独有一个「愿望清单」版面，新加的会发 Discord 通知。
# 也可以直接跟 Claude 说「加进 wishlist」并附上截图或链接，它会按 .claude/skills/wishlist/SKILL.md 填好。
#
# 字段：
#   name     必填，名字
#   image    图片：仓库里 docs/wishlist/ 下的文件名，或完整的图片网址
#   price    价格（数字或文字），currency 货币（NT$ / ¥ / US$ …）
#   specs    规格，任意几行「名称: 值」
#   shop     在哪里卖；url 商品页或报道链接
#   added    加入日期
#   status   想要 / 纠结 / 已入手 / 没买到 / 已过期（去不了、买不到了但还想要），默认 想要
#            纠结 = 还在犹豫买不买：单独排进「纠结名单」，不算进想要的合计；你自己决定放不放进去
#   alternatives 可选（纠结的东西用）：帮你查好的类似好产品，每条 {name, price, why, url}，卡片上会列出来
#   similar  可选（纠结的东西用）：每天搜类似新产品的搜索词，格式同 items.yaml 的 similar
#            {label: 同类名, lang: 语言区, query: 搜索词, need: [...]}；搜到新的会列在卡片上并发 Discord
#   watch    可选，关联的关注项名字（items.yaml 里的 name）。版面上会顺带显示它的最新消息
#   note     可选，一句话备注
#   likes    可选，从这件东西看出的喜好：「标签: [关键词…]」。主页「我会喜欢？」会用它从收集到的消息里挑推荐
#            同一个东西的几种写法用 | 连起来写成一个词（"Snoopy|スヌーピー|史努比"），推荐去重时算同一个
#            写成 -词 的是排除："リス|-リスト" 里「やることリスト」不算命中リス。只看消息标题，英文短词要是完整的词
#   basics   可选，likes 里哪些标签只是基本属性（如 马克杯、限定款）：照样加分，但推荐去重时不看它们
#   photo    可选，从愿望清单页上传的照片编号（Claude 定时任务处理照片时填，网页靠它显示「已加入」）

wishlist: []   # test2 アカウントの愿望清单（空から）。test1 のものは archive/test1/wishlist.yaml
