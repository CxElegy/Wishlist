# 愿望清单：看到喜欢的东西就记在这里，网页上会单独有一个「愿望清单」版面，新加的会发 Discord 通知。
# 也可以直接跟 Claude 说「加进 wishlist」并附上截图或链接，它会按 .claude/skills/wishlist/SKILL.md 填好。
#
# 字段：
#   name     必填，名字
#   image    图片：仓库里 docs/wishlist/ 下的文件名，或完整的图片网址
#   price    价格（数字或文字），currency 货币（NT$ / ¥ / US$ …）
#   specs    规格，任意几行「名称: 值」
#   shop     在哪里卖；url 商品页或报道链接
#   added    加入日期
#   status   想要 / 已入手 / 没买到，默认 想要
#   watch    可选，关联的关注项名字（items.yaml 里的 name）。版面上会顺带显示它的最新消息
#   note     可选，一句话备注

wishlist:
  - name: 黑貓魔法術溫變馬克杯
    image: starbucks-black-cat-mug.jpg
    price: 850
    currency: NT$
    specs:
      容量: 355 ml
      系列: 2026 万圣节黑猫（限量）
    shop: 台湾星巴克
    url: https://www.cosmopolitan.com/tw/lifestyle/hot-topics/g74024085/starbucks-halloween-2026-1010/
    added: 2026-10-12
    status: 想要
    watch: 星巴克马克杯
    note: 温变杯，倒热饮会变色；10/7 起限量开卖
