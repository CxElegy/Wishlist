# 愿望清单：看到喜欢的东西就记在这里，网页上会单独有一个「愿望清单」版面，新加的会发 Discord 通知。
# 也可以直接跟 Claude 说「加进 wishlist」并附上截图或链接，它会按 .claude/skills/wishlist/SKILL.md 填好。
#
# 字段：
#   name     必填，名字
#   image    图片：仓库里 docs/wishlist/ 下的文件名，或完整的图片网址
#   price    价格（数字或文字），currency 货币（NT$ / ¥ / US$ …）
#   specs    规格，任意几行「名称: 值」
#   shop     在哪里卖；url 商品页或报道链接
#   added    加入日期
#   status   想要 / 已入手 / 没买到 / 已过期（去不了、买不到了但还想要），默认 想要
#   watch    可选，关联的关注项名字（items.yaml 里的 name）。版面上会顺带显示它的最新消息
#   note     可选，一句话备注
#   likes    可选，从这件东西看出的喜好：「标签: [关键词…]」。主页「我会喜欢？」会用它从收集到的消息里挑推荐
#            同一个东西的几种写法用 | 连起来写成一个词（"Snoopy|スヌーピー|史努比"），推荐去重时算同一个
#   basics   可选，likes 里哪些标签只是基本属性（如 马克杯、限定款）：照样加分，但推荐去重时不看它们

wishlist:
