    schemes:
      - {id: kind, label: 種類, values: [{v: 映画, re: '\bfilm\b|movie|电影|電影|劇場版|剧场版'}, {v: アニメ, re: 'anime|animated|动画|動畫|アニメ'}, {v: ドラマ, re: 'television series|TV series|drama|电视剧|電視劇|剧集|劇集|ドラマ'}, {v: マンガ, re: 'manga|comic|漫画|漫畫|マンガ'}, {v: 小説・ラノベ, re: 'novel|小说|小說|小説|ライトノベル|light novel|轻小说|輕小說'}, {v: シリーズ, re: 'media franchise|franchise|メディアミックス|フランチャイズ'}, {v: 雑誌・写真集, re: 'magazine|雑誌|杂志|雜誌|写真集|画集|photobook'}, バラエティ, ドキュメンタリー]}
