# 头版的板块（ジャンル）一览：事先定全，新关注项只是「对号入座」，不临时开新板块。
# 参考 IAB Tech Lab Content Taxonomy 3.1 的大类（37 个，去掉政治・犯罪・灾害・法律・房地产・职业・宗教等不适合个人兴趣简报的），
# 按日本新闻网站的叫法合并成 8 个大类（2026-10-19 用户定的：分得粗一点，细的靠小分类）。没有关注项的板块网页上不显示。
#
# 每个板块：
#   key      数据里的名字（items.yaml 的 section 写这个；中文）。以前的 17 个板块的 key 由 taxonomy.LEGACY 换成现在的
#   ja / en  网页上显示的日语名 / 英文标签
#   color    板块色（白字、浅底上的小字都要过 WCAG AA 4.5:1，tests/test_design.py 检查）
#   icon     twemoji 的编号（目录的板块图标）
#   kind     设置页向导「这是什么？」的默认答案（docs/additem.js 的 KINDS）
#   prio     对号入座时先看哪个（小的先，默认 50）：ゲーム先看（「漫画原作のゲーム」はゲーム）
#   words    对号入座用的词（正则，不分大小写）：维基数据的说明、名字里有这些词就推荐这个板块
#   schemes  小分类的分法（第一种是默认），values 是常用的值（向导里直接选；放不进去再起新名字，日语、短）
#   facets   题材型（「猫」这种普通词）加关注项时推荐的「面」，按第一种分法的值分（没写的用 taxonomy.GENERIC_FACETS）
#
# 「シリーズ」（方法 4，用户定的）：一个作品在同一个板块里有两种以上的媒体（ちいかわ = 漫画・アニメ・映画）→ 合成一个版面，小分类写「シリーズ」。
# 加新板块：在这里加一项（颜色先过 AA），不用改代码。改了分法，给这个板块的所有关注项补上 subs。

