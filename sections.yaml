      - {id: platform, label: プラットフォーム, values: [{v: スマホ, re: 'mobile|iOS|Android|手游|手遊'}, {v: 家庭用ゲーム機, re: 'Switch|PlayStation|PS5|Xbox|console'}, {v: PC, re: '\bPC\b|Steam|Windows'}, マルチ]}

