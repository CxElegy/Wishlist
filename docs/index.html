<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ウォッチリスト通信</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 入口（手書き・生成しない）。色は簡報と同じトークン（scripts/render.py の :root） */
:root{--ink:#1A1C22;--paper:#EDEBE6;--rose:#B8336A;--card:#FBF8F1;--gold:#FFD23F;--hair:color-mix(in srgb,var(--ink) 16%,transparent);
 --font-sans:'Noto Sans JP',sans-serif;--fs-label:11px;--shadow:4px 4px 0 var(--ink);--shadow-l:8px 8px 0 var(--ink);--tilt:-1.5deg}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:500 15px/1.6 var(--font-sans);-webkit-font-smoothing:antialiased}
main{max-width:880px;margin:0 auto;padding:56px 16px 64px}
h1{display:inline-block;margin:0 0 8px;padding:6px 18px;background:var(--card);border:3px solid var(--ink);box-shadow:var(--shadow-l);
 transform:rotate(var(--tilt));font-size:clamp(28px,6vw,44px);font-weight:900;letter-spacing:.04em}
.lead{margin:20px 0 32px;color:color-mix(in srgb,var(--ink) 75%,transparent)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.card{display:flex;flex-direction:column;gap:10px;padding:22px 22px 18px;background:var(--card);border:3px solid var(--ink);box-shadow:var(--shadow);
 color:inherit;text-decoration:none;transition:transform .15s,box-shadow .15s}
.card:hover,.card:focus-visible{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink);outline:none}
.card.now{box-shadow:var(--shadow-l);border-color:var(--rose)}
.tag{align-self:flex-start;padding:2px 10px;font-size:var(--fs-label);font-weight:700;letter-spacing:.08em;background:var(--ink);color:var(--card);transform:skewX(-8deg)}
.now .tag{background:var(--rose)}
.card h2{margin:0;font-size:26px;font-weight:900}
.card p{margin:0;font-size:14px}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;padding-top:10px;border-top:1px solid var(--hair);font-size:13px}
.links a{color:var(--ink);font-weight:700}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<main>
<h1>ウォッチリスト通信</h1>
<p class="lead">版がふたつあります。いま更新しているのは test2 です。</p>
<div class="cards">
  <section class="card now">
    <span class="tag">いまの版 · 毎日更新</span>
    <h2>test2</h2>
    <p>2026-10-19 から空の状態で始めた版。関注項を足すときは「1 つの名前 = 1 つの版面」（グッズ・イベントは検索語と目次の枝）。</p>
    <div class="links"><a href="test2/">簡報 →</a><a href="test2/settings.html">設定</a><a href="test2/admin.html">管理ページ</a><a href="test2/wishlist.html">欲しい物</a></div>
  </section>
  <section class="card">
    <span class="tag">アーカイブ · 更新停止</span>
    <h2>test1</h2>
    <p>2026-10-19 までの版をそのまま残した写し。見るだけで、変更はできません。</p>
    <div class="links"><a href="test1/">簡報 →</a><a href="test1/settings.html">設定</a><a href="test1/admin.html">管理ページ</a><a href="testground/">テストグラウンド</a></div>
  </section>
</div>
</main>
</body>
</html>
