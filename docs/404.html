<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ページが見つかりません</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Anton&family=Yusei+Magic&family=JetBrains+Mono:wght@500;700&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Anton&family=Yusei+Magic&family=JetBrains+Mono:wght@500;700&display=swap"></noscript>
<style>
:root{--ink:#1A1C22;--paper:#EDEBE6;--rose:#B8336A;--sheet:#F4EDE4;--card:#FBF8F1;--ink0:#1A1C22;--paper0:#EDEBE6;--card0:#FBF8F1;--gold:#FFD23F;--alert:#D7261E;--flame:#FF7A1A;--ember:#5A1410;--blueflame:#4F8BFF;--good:#1F7A55;--discord:#5865F2;
 --by-ai:#6B3FC4;--by-rule:#1F7A55;   /* 流れの図：AI（Claude）が判断する手順 / 規則（プログラム）で決まる手順 */
 --font-sans:'Noto Sans JP','Noto Sans TC','Noto Sans SC','Noto Sans KR',sans-serif;--font-serif:'Noto Serif JP','Noto Serif SC',serif;
 --font-mono:'JetBrains Mono','Noto Sans JP',monospace;--font-num:'Anton',Impact,'Noto Sans JP',sans-serif;--font-hand:'Yusei Magic','Noto Sans JP',sans-serif;
 --fs-label:11px;--fs-tag:10px;--gap:16px;--hair:color-mix(in srgb,var(--ink) 16%,transparent);
 --shadow:4px 4px 0 var(--ink);--shadow-l:8px 8px 0 var(--ink);--tilt:-1.5deg;--skew:-8deg;
 /* 話題度の分析ページのグラフ（dataviz の検証済みパレット）：指標 6 色・点数の濃淡 5 段・前週比の上下 */
 --viz-1:#2a78d6;--viz-2:#eb6834;--viz-3:#1baf7a;--viz-4:#eda100;--viz-5:#e87ba4;--viz-6:#008300;
 --seq-0:#cde2fb;--seq-1:#9ec5f4;--seq-2:#5598e7;--seq-3:#256abf;--seq-4:#104281;--up:#e34948;--down:#2a78d6}
html:lang(zh){--font-sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;--font-mono:'JetBrains Mono','Noto Sans SC','Microsoft YaHei',monospace}  /* 中国語のページは字を端末の中国語フォントで 1 種類に（H6：中国語の Web フォントは読まない。日本語の字体が先だと簡体字だけ別の字体に混ざる。D2） */
/* デザインの骨格（PRODUCT.md）：文字箱の後ろに硬い影、見出しと枠だけ少し傾ける（-1〜-2.5°）、ラベルは平行四辺形。
   本文・リスト・作品の版面は傾けない。配色はトークンと版面の色だけ */
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:500 15px/1.6 var(--font-sans);-webkit-font-smoothing:antialiased}
html,body{overflow-x:clip}  /* 傾けた箱・吹き出しの矢印が端からはみ出してもページが横にずれない（sticky は効いたまま） */
::selection{background:var(--rose);color:#FFF}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.page{max-width:1200px;margin:0 auto;padding:40px 24px;display:flex;flex-direction:column;gap:28px}
.mono{font-family:var(--font-mono);font-size:13px}
/* ---------- 共通の部品：ラベル・見出し箱・行ごとの黒箱 ---------- */
.tg{display:inline-block;flex:none;white-space:nowrap;background:var(--sc,var(--ink));color:#FFF;padding:1px 10px;transform:skewX(var(--skew));
 font:700 12px/1.55 var(--font-sans);letter-spacing:.04em;font-style:normal}
.tg>span{display:inline-block;transform:skewX(8deg)}
.sh{margin:0;display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 14px}
.sh>span{display:inline-block;background:var(--ink);color:var(--card);padding:6px 18px 6px 16px;transform:rotate(var(--tilt));
 box-shadow:4px 4px 0 var(--rose);font:900 24px/1.25 var(--font-sans);letter-spacing:.06em}
.sh small{font:700 12px/1.5 var(--font-sans);letter-spacing:.06em;opacity:.7}
.hb{display:inline;background:var(--ink);color:var(--card);padding:3px 12px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
/* ---------- 画像：縦横比が枠に近い写真は枠いっぱい（.fill、FIT_JS が付ける）。違う写真はぼかしの上に全体を表示 ---------- */
.pic{position:relative;overflow:hidden;aspect-ratio:16/9;background:color-mix(in srgb,currentColor 8%,transparent)}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.pic.fill img:not(.bg):not(.ico){object-fit:cover}
.pic .ph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:12px;text-align:center;
 font:900 clamp(15px,2.2vw,26px)/1.2 var(--font-sans);letter-spacing:.04em;color:#FFF;text-shadow:0 1px 2px color-mix(in srgb,var(--ink) 70%,transparent);
 background:radial-gradient(circle,color-mix(in srgb,#000 22%,transparent) 1px,transparent 1.5px) 0 0/7px 7px,linear-gradient(color-mix(in srgb,var(--ink) 34%,transparent),color-mix(in srgb,var(--ink) 34%,transparent)),var(--ac,var(--rose))}   /* 明るい作品色でも白い字が読めるよう墨を 34% 重ねる */
.pic.none{background:none}
.pic.none .ph{display:flex}
.pic.icon{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
 background:color-mix(in srgb,currentColor 6%,transparent)}
.pic.icon img.ico{position:static;width:min(64px,30%);height:auto;aspect-ratio:1;object-fit:contain;
 background:#FFFFFF;border-radius:14px;padding:6px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.pic.icon .src{max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:700 13px var(--font-sans);opacity:.75}
.pic:not(.icon) img.ico,.pic:not(.icon) .src{display:none}
/* 縦長・正方形の写真（F-16，2026-10-31）：ぼかしで余白を埋めない。大きいカード（.hero・.lead・.wide）は枠を写真の幅に絞り（.nw）、
   空いた横に同じ版面の次の記事（.nx）を置く。小さいカードは薄い地の上に写真全体 */
.card.nw .pic{justify-self:start;align-self:start}
.hero.nw{grid-template-columns:auto minmax(0,1fr)}.card.wide.nw{grid-template-columns:auto minmax(0,1fr)}
.lead.nw{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 24px;align-content:start}.lead.nw>*:not(.pic){margin-bottom:8px}
.lead.nw>.pic{grid-column:1;grid-row:1}.lead.nw.ls>.nx:not(.pic):not(.lk):not(.xplay){grid-column:1/-1;grid-template-columns:repeat(var(--nxn,2),minmax(0,var(--nxw,190px)))}.lead.nw>.ltx{grid-column:2;grid-row:1;display:flex;flex-direction:column;gap:8px;min-width:0;margin-bottom:0}.lead.nw>.ltx>*{margin-bottom:0}  /* .ls = 横長の写真：写真の形のまま幅の半分、次のニュースは横いっぱい */.lead.nw>*:not(.pic):not(.lk):not(.xplay){grid-column:2}
.nxd,.dupd{display:none!important}   /* L7：次のニュースに出した記事の元のカード（同じ記事を 2 回出さない） */
.nx{position:relative;z-index:2;display:grid;grid-template-columns:repeat(var(--nxn,2),minmax(0,1fr));gap:12px;margin-top:6px;padding-top:10px;border-top:1px solid color-mix(in srgb,currentColor 25%,transparent)}
.nx a{display:flex;flex-direction:column;gap:5px;min-width:0;color:inherit;text-decoration:none}
.nx img{width:100%;aspect-ratio:3/2;object-fit:cover;border:1.5px solid color-mix(in srgb,currentColor 45%,transparent)}
.nx img.whole{object-fit:contain;background:color-mix(in srgb,currentColor 8%,transparent)}
.nx b{font:700 13px/1.4 var(--font-sans);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nx a:hover b{text-decoration:underline;text-underline-offset:3px}
.nx>i{grid-column:1/-1;font:700 11px var(--font-mono);letter-spacing:.12em;font-style:normal;opacity:.7}
/* 小さいカード・気になるかも（F-16 続き）：縦長・正方形の写真は枠を写真の幅に絞り（.sb）、空いた横に見出しなど字の列を置く。幅・高さは FIT_JS が決める */
.sb>.pic{aspect-ratio:auto;justify-self:start;align-self:start}
.card.sb:not(.mini),.wc.sb{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:12px;row-gap:0;grid-template-rows:repeat(8,auto) minmax(0,1fr)}.card.sb:not(.mini)>.pic,.wc.sb>.pic{align-self:stretch;height:auto!important}  /* 写真の枠は 9 行にまたがり、字の入らない行にも行の隙間（8px）が 7 つ付いて、カードが字より 73〜86px 高くなっていた（2026-11-02）：隙間は字の部品の下の余白で付ける */
.card.sb:not(.mini)>.pic,.wc.sb>.pic{grid-column:1;grid-row:1/span 9}
.card.sb:not(.mini)>*:not(.pic):not(.lk),.wc.sb>*:not(.pic):not(.lk){grid-column:2}
.card.sb:not(.mini){grid-template-rows:repeat(8,auto) minmax(0,1fr)}  /* 写真の枠が字より高いとき、余りを字の入らない行に分けず 3 行目が受ける（390px で 27px 余計に高くなっていた） */
.card.sb:not(.mini)>*:not(.pic):not(.lk):not(:last-child),.wc.sb>*:not(.pic):not(.lk):not(:last-child){margin-bottom:8px}
.card.mini.sb{grid-template-columns:auto minmax(0,1fr)}
.tape.sb{grid-template-columns:6px auto minmax(0,1fr)}.tape.sb>.pic{grid-column:2;grid-row:1/3;margin-bottom:6px}.tape.sb>.lbl{grid-column:3;grid-row:1/3}
.pk.sb>a{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;align-items:start}
.pk.sb .pic{--pko:0px}.pk.sb .pkt{margin:0;padding:12px 12px 10px}.pk.sb.big .pkt{margin:0;padding:18px 18px 14px}
/* ---------- 報頭 ---------- */
.mast{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px 20px}
.mast .mtitle{display:flex;align-items:flex-end;gap:14px;min-width:0}
.mast h1{margin:0;display:inline-block;background:var(--card);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);transform:rotate(-1deg);
 padding:10px 22px 8px;font:900 clamp(26px,3.4vw,48px)/1.1 var(--font-sans);letter-spacing:.02em;white-space:nowrap}
.mast .stamp{padding-bottom:6px;font:700 11px/1.4 var(--font-sans);letter-spacing:.08em;opacity:.65}
.mast .tools{display:flex;align-items:stretch;gap:10px}
.mast .meta{display:flex;flex-direction:column;justify-content:center;padding:4px 14px;border:2px solid var(--ink);background:var(--card)}
.mast .meta small{font:700 11px/1.3 var(--font-sans);letter-spacing:.2em;opacity:.7}
.mast .meta b{font:26px/1 var(--font-num);letter-spacing:.02em;white-space:nowrap}
.mastwish{display:flex;align-items:center;gap:8px;padding:8px 14px;border:2px solid var(--rose);background:var(--rose);color:#FFF;
 box-shadow:var(--shadow);font:900 14px/1.3 var(--font-sans);white-space:nowrap;transition:transform .1s,box-shadow .1s}
.mastwish small{font:700 11px/1.3 var(--font-sans);background:var(--card);color:var(--rose);padding:1px 7px}
.mastwish:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.mastset{display:flex;align-items:center;padding:8px 14px;border:2px solid var(--ink);background:var(--card);font:700 13px var(--font-sans);white-space:nowrap}
.mastset:hover{background:var(--ink);color:var(--card)}
.navwish{display:flex;align-items:center;gap:8px;margin:10px 0 0 14px;padding:8px 12px;border:2px solid var(--rose);color:var(--rose);
 font:900 13px var(--font-sans);letter-spacing:.1em;flex:none;box-shadow:3px 3px 0 var(--rose)}
.navwish small{margin-left:auto;font:700 11px var(--font-sans);opacity:.8}
.navwish:hover{background:var(--rose);color:#FFF}
@media (max-width:1000px){.navwish{display:none}}
.issue{display:flex;flex-direction:column;gap:40px}
/* 本文の小分類の区切り（目次と同じ「板块 → 小分類」。目立たせない：細い線と小さな字だけ） */
.subhead{display:flex;align-items:center;gap:10px;margin:0 0 -22px;padding-bottom:5px;border-bottom:2px solid color-mix(in srgb,var(--sc) 40%,transparent)}
.subhead .tg{font:800 var(--fs-label) var(--font-sans);padding:1px 9px}
.subhead b{font:800 15px var(--font-sans);color:var(--ink)}
.subhead small{font:700 11px var(--font-mono);color:var(--ink);opacity:.62;margin-left:auto}
/* ---------- トップ：毎日刷り直すポスター。地色はその日のトップ記事の写真から（--tint / --deep / --hacc） ---------- */
.front{display:flex;flex-direction:column;gap:40px}
.poster{position:relative;background:var(--tint,var(--sheet));color:var(--ink);border:2px solid var(--ink);box-shadow:var(--shadow-l);padding:22px 28px 18px}
/* 見せ場は頭条 1 枚（D5、2026-10-24 ユーザーが見本の右を選んだ）：倍の影・少し傾けた枠・傾けた見出し・平行四辺形の札をポスターに集める。下の照片墙・棚・版面は今のまま */
.poster{--tilt:-2.2deg;--skew:-10deg;box-shadow:10px 10px 0 var(--rose),20px 20px 0 var(--ink);transform:rotate(-.6deg)}
.poster .phead .lab{transform:skewX(var(--skew));box-shadow:4px 4px 0 var(--rose)}
.poster .top h2{transform:rotate(var(--tilt))}
.poster .tag,.poster .tg{transform:skewX(var(--skew));box-shadow:3px 3px 0 var(--ink)}
.poster::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.12;
 background-image:radial-gradient(var(--deep,var(--ink)) .7px,transparent .9px);background-size:6px 6px}
.poster .marks{position:absolute;inset:10px;pointer-events:none;opacity:.5;background:
 linear-gradient(var(--ink),var(--ink)) 0 0/16px 1px no-repeat,linear-gradient(var(--ink),var(--ink)) 0 0/1px 16px no-repeat,
 linear-gradient(var(--ink),var(--ink)) 100% 0/16px 1px no-repeat,linear-gradient(var(--ink),var(--ink)) 100% 0/1px 16px no-repeat,
 linear-gradient(var(--ink),var(--ink)) 0 100%/16px 1px no-repeat,linear-gradient(var(--ink),var(--ink)) 0 100%/1px 16px no-repeat,
 linear-gradient(var(--ink),var(--ink)) 100% 100%/16px 1px no-repeat,linear-gradient(var(--ink),var(--ink)) 100% 100%/1px 16px no-repeat}
.phead{position:relative;display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;font:700 12px/1.4 var(--font-sans);letter-spacing:.06em}
.phead .lab{background:var(--ink);color:var(--card);padding:3px 12px;transform:skewX(var(--skew))}
.phead .day{margin-left:auto;font:15px/1 var(--font-num);letter-spacing:.04em;color:var(--deep,var(--ink))}
.top{position:relative;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);grid-template-rows:auto 1fr;gap:10px 36px;margin-top:14px;color:var(--ink)}
.pdate{display:flex;align-items:flex-end;gap:14px;padding-top:4px}
.pdate b{font:clamp(84px,9.5vw,164px)/.86 var(--font-num);color:var(--deep,var(--ink));letter-spacing:-.01em;text-shadow:5px 5px 0 var(--hacc,var(--rose))}
.pdate span{display:flex;flex-direction:column;align-items:center;padding:8px 12px 6px;background:var(--deep,var(--ink));color:var(--card);
 transform:rotate(-3deg);box-shadow:var(--shadow);font:40px/1 var(--font-num)}
.pdate small{font:700 11px/1.4 var(--font-sans);letter-spacing:.2em}
.frame{grid-column:2;grid-row:1/3;position:relative;align-self:start;margin:12px 8px 8px 0;padding:8px;background:var(--card);
 border:2px solid var(--ink);box-shadow:var(--shadow-l);transform:rotate(-2deg);transition:transform .2s}
.top:hover .frame{transform:rotate(-1deg) translateY(-2px)}
.frame .pic{border:1.5px solid var(--ink);color:var(--ink)}
.burst{position:absolute;top:4px;left:4px;z-index:2;display:grid;place-items:center;width:92px;height:92px;background:var(--alert);color:#FFF;
 font:900 21px/1 var(--font-sans);letter-spacing:.12em;transform:rotate(8deg);filter:drop-shadow(3px 3px 0 var(--ink));
 clip-path:polygon(50% 0,61% 13%,77% 6%,80% 23%,97% 25%,89% 40%,100% 50%,89% 60%,97% 75%,80% 77%,77% 94%,61% 87%,50% 100%,39% 87%,23% 94%,20% 77%,3% 75%,11% 60%,0 50%,11% 40%,3% 25%,20% 23%,23% 6%,39% 13%)}
.ptxt{display:flex;flex-direction:column;gap:16px;align-self:end;padding-bottom:6px;min-width:0}
.kick{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.kick em{font:16px/1 var(--font-num);font-style:normal;letter-spacing:.04em;color:var(--deep,var(--ink))}
.top h2{margin:0;max-width:600px;font:900 clamp(21px,2.2vw,31px)/1.55 var(--font-sans);letter-spacing:.01em;transform:rotate(var(--tilt));transform-origin:left top}
.top:hover .hb{background:var(--deep,var(--ink))}
.top p{margin:0;max-width:560px;font-size:14px;line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.startgo{display:flex;align-items:center;justify-content:center;width:max-content;max-width:100%;min-height:56px;padding:10px 26px;border:2px solid var(--ink);background:var(--gold);color:var(--ink);
 font:900 19px/1.3 var(--font-sans);letter-spacing:.04em;text-decoration:none;box-shadow:5px 5px 0 var(--ink);transform:skewX(var(--skew,-10deg))}
.startgo:hover,.startgo:focus-visible{background:var(--card);box-shadow:2px 2px 0 var(--ink)}
@media (max-width:560px){.startgo{width:100%}.top.start{display:block}.top.start .pdate{display:none}}
.pfoot{position:relative;display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;margin-top:16px;padding-top:12px;border-top:1.5px solid var(--ink);
 font:700 11px/1.4 var(--font-sans);letter-spacing:.06em;color:var(--deep,var(--ink))}
@media (max-width:560px){.pfoot .pnote{display:none}}  /* 右下の固定ボタンの下で 2 行目が切れる */
.cbar{display:inline-block;flex:none;width:112px;height:10px;border:1px solid var(--ink);
 background:linear-gradient(90deg,var(--sc1,#00B4EE) 0 14%,var(--sc2,#FF3D8B) 14% 28%,var(--gold) 28% 42%,var(--ink) 42% 56%,var(--hacc,var(--rose)) 56% 70%,var(--deep,var(--ink)) 70% 84%,var(--card) 84%)}
/* ---------- ほかの注目ニュース：写真の壁 ＋ ジャンルの棚 ---------- */
.spot{display:flex;flex-direction:column;gap:22px}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,280px);gap:22px;align-items:start}
/* 左の壁と右の列の下端をそろえる：短いほうが伸びる（壁は各段が均等に伸び、右の列は最後の箱が伸びる） */
.mgrid>.wall{align-content:start}
.mgrid.one .wall>.wc b{-webkit-line-clamp:unset;display:block;overflow:visible}  /* 壁の組み方が高さを決めるので、見出しは「…」で切らない（2026-11-09） */
.mgrid.one{grid-template-columns:minmax(0,1fr)}.wall>.fside{align-self:start;min-width:0}  /* PC：右の列は壁の升目の右上（FIT_JS の wall()）。下にもカードが入る（2026-11-09） */
.mgrid .wc{justify-content:flex-start}
.mgrid .wall>.wc.cmp{display:grid;grid-template-columns:46% minmax(0,1fr);column-gap:12px;row-gap:6px;align-content:start;grid-auto-rows:min-content}.mgrid .wall>.wc.cmp>.pic{grid-column:1;grid-row:1/span 9;align-self:start;width:auto!important;height:auto!important;aspect-ratio:4/3!important;margin:0}.mgrid .wall>.wc.cmp>*:not(.pic):not(.lk){grid-column:2;min-width:0}.mgrid .wall>.wc.cmp>.pic img:not(.bg):not(.ico){object-fit:cover}  /* 列の下に入りきらないカードは写真左・字右の小さい形で（2026-11-09 店長：ほかの注目ニュースは画面の下まで） */
.fside>:last-child{flex:1;display:flex;flex-direction:column}.fside>.swish:has(.sempty){flex:none}.fside:has(.sempty)>.agenda{flex:1 1 auto;display:flex;flex-direction:column}.fside:has(.sempty)>.agenda>ol{flex:1 1 auto;display:flex;flex-direction:column;justify-content:space-around}
/* 写真が開けず字だけになったカードは、同じ所に写真のあるカードがあれば出さない（2026-11-08 店長「我一定要图」） */
section.sec:has(article.card:not(.nophoto)) article.card.nophoto:not(.hero):not(.lead),.mgrid .wall:has(>.wc:not(.nophoto)) > .wc.nophoto{display:none!important}.fside>:last-child>ol{flex:1 1 auto;display:flex;flex-direction:column;justify-content:space-around}  /* 右の列が壁の高さまで伸びた分は、箱の下にまとめず行の間に分ける（2026-11-08 店長：欲しい物の下の空白） */
.fside{display:flex;flex-direction:column;gap:20px;min-width:0}

/* 小さいカードの段（JS の mason が .mas に包む）：決まった升目で同じ段の背をそろえず、1px の行に 1 枚ずつ一番低い列へ積む。中身の高さで詰まり、段の途中に空きが出ない（2026-11-02 L1・L2） */

.hero.tight{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}.hero.tight h2{font-size:23px}.hero.tight .blurb,.hero.tight .nx{display:none}.grid>.hero.tight .pic{height:auto!important;width:auto!important;aspect-ratio:auto!important;justify-self:stretch!important;align-self:start!important;background:none!important}.grid>.hero.tight .pic img:not(.bg):not(.ico){position:static!important;display:block;width:100%!important;height:auto!important;aspect-ratio:auto!important;object-fit:contain!important;transform:none!important;inset:auto!important}  /* 枠は写真そのものの形（列の幅いっぱい・高さは写真の比率） */.hero.tight.nw{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.hero.tighter.nw{grid-template-columns:minmax(0,2fr) minmax(0,3fr)}.hero.tighter{grid-template-columns:minmax(0,2fr) minmax(0,3fr)}.hero.tighter h2{font-size:19px}.hero.tightest{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}.hero.tightest h2{font-size:17px}.hero.tightest.nw{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}.hero.capped,.hero.capped.nw{grid-template-columns:auto minmax(0,1fr)}.grid>.hero.capped .pic{justify-self:start!important}.grid>.hero.capped .pic img:not(.bg):not(.ico){width:auto!important;max-width:100%!important;max-height:var(--hmax)!important}  /* 写真の高さを字の高さに（A5）。字の列が残りの幅 */  /* 重大のある版面が画面の割合に入らないとき：重大を詰める（審美基準 F1・C1。字は切らず、要約を外し、写真と字を小さく） */
.grid>.lead .pic,.mas>.lead .pic{aspect-ratio:auto;height:260px}
.grid>.lead h2,.mas>.lead h2,.card.wide h3,.mini h3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.grid>.lead .blurb,.mas>.lead .blurb,.card.wide .blurb{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.mini{display:grid;grid-template-columns:120px minmax(0,1fr);grid-template-rows:auto 1fr;gap:6px 14px;align-content:start;
 padding-bottom:14px;border-bottom:1px solid color-mix(in srgb,currentColor 22%,transparent)}
.mini .pic{grid-row:span 2;align-self:start;aspect-ratio:4/3}
/* 写真のない記事：字だけ（出典と日付・大きな見出し），左に作品色の線 */

.mini .pic .ph{font-size:12px}.mini .pic.icon{gap:4px}.mini .pic.icon img.ico{width:min(40px,30%);border-radius:9px;padding:4px}
.mini .pic.icon .src{font-size:11px}

.card.mini>:is(.xprice,.xevent,.xgal){grid-column:2}.card.mini>:is(.xprice,.xevent){justify-self:start}.xevent span{white-space:nowrap}  /* 日程・価格は字の下に（写真の下の空きに落とさない） */
.side .card.mini{grid-template-columns:110px minmax(0,1fr)}
/* 小さいカードの写真は幅 40%・高さは字の列いっぱい（2026-11-07 ユーザー「图有点小了」：120×90 の下に空きが残っていた。スマホの 42% と同じ考え）。
   写真は字の列の高さいっぱい。主役の位置がわからず大きく切れる絵（ロゴ・文字入り）だけ全体を見せ、周りは絵の端の色で埋める .whole（2026-11-07 店長の印） */
.card.mini:not(.nophoto){grid-template-columns:minmax(110px,40%) minmax(0,1fr)}
.card.mini:not(.nophoto)>.pic{align-self:stretch;justify-self:stretch;width:auto!important;height:auto!important;min-height:96px;aspect-ratio:auto!important}
.card.mini:not(.nophoto){row-gap:0;grid-template-rows:repeat(8,auto) minmax(0,1fr)}.card.mini:not(.nophoto)>.pic{grid-column:1;grid-row:1/span 9}.card.mini:not(.nophoto)>*:not(.pic):not(.lk){grid-column:2}
.pic.whole img:not(.bg):not(.ico){object-fit:contain!important}
.pk.shaped .pkt{flex:1 1 auto}
.pic.hasduo>img:not(.bg):not(.ico){visibility:hidden}.pic>.duo{position:absolute;inset:0;display:flex;gap:3px;background:var(--card)}.pic>.duo>span{display:block;height:100%;background-repeat:no-repeat}
.wc.lead.half{display:flex!important;flex-direction:row!important;align-items:flex-start;gap:16px}
.wc.lead.half>.pic{flex:0 0 var(--hw)!important;width:var(--hw)!important;max-width:var(--hw)!important;height:auto!important}
.wc.lead.half>.htx{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px}
.wc.lead.half>.htx>b{-webkit-line-clamp:unset;display:block;min-height:0;font-size:14px;font-weight:700}   /* 字の大きさはほかのカードと同じ（2026-11-08 店長：字の大きさがそろわないのは減点） */
/* 予定と欲しい物（右の列が下に回る幅）：横いっぱいの箱を縦に積み、中身を段に並べる（テストグラウンド案 1。Every Layout の Grid）。中身が 0 件の箱は 1 行の帯 */

}
.wc.sb .tg,.card.sb .tg{max-width:100%;white-space:normal}

.brief{padding:12px 26px 18px;border-top:1px solid var(--line)}

 font:900 15px/1 var(--font-sans)}

/* ---- 作品ごとの装飾（motif = 版面模版）は templates/*.css から読み込んで、ここに入れる ---- */
/* 版面模版「retro」：平成动画：星星、角丸题字、双层圆点底纹、发光的强调色。只用作品的配色变量（--bg/--fg/--acc/--abg/--afg/--aacc/--line），说明见 TEMPLATES.md */
.m-retro{background-image:radial-gradient(circle,color-mix(in srgb,var(--acc) 35%,transparent) 1px,transparent 1.6px),

/* 版面模版「manga」：漫画：网点底纹、斜着的分格、擬音字。只用作品的配色变量（--bg/--fg/--acc/--abg/--afg/--aacc/--line），说明见 TEMPLATES.md */

.m-manga .card.mini:nth-child(even){clip-path:polygon(3% 0,100% 0,100% 100%,0 100%)}
/* 版面模版「pop」：流行可爱：水玉底纹、圆角题字和圆角照片。只用作品的配色变量（--bg/--fg/--acc/--abg/--afg/--aacc/--line），说明见 TEMPLATES.md */
.m-pop{background-image:radial-gradient(circle,color-mix(in srgb,var(--acc) 22%,transparent) 5px,transparent 5.5px);background-size:46px 46px}

 -webkit-mask:repeating-linear-gradient(90deg,#000 0 14px,transparent 14px 24px) 0 4px/100% 8px no-repeat,linear-gradient(#000,#000) 0 0/100% 4px no-repeat,linear-gradient(#000,#000) 0 12px/100% 4px no-repeat;
 mask:repeating-linear-gradient(90deg,#000 0 14px,transparent 14px 24px) 0 4px/100% 8px no-repeat,linear-gradient(#000,#000) 0 0/100% 4px no-repeat,linear-gradient(#000,#000) 0 12px/100% 4px no-repeat}

.m-noir{background-image:radial-gradient(ellipse at 50% 40%,transparent 50%,color-mix(in srgb,#000 30%,transparent) 100%),repeating-linear-gradient(104deg,color-mix(in srgb,var(--fg) 7%,transparent) 0 1px,transparent 1px 23px)}

:root{--bar-tabs:0px;--bar-full:0px}   /* 上の固定の帯（≤1000 の横帯）の高さ：tabs＝板块の段だけ・full＝作品の段まで。NAV_JS が実測して入れる。吸着の余白（scroll-margin-top）と版面の高さの予算（FIT_JS・SHUFFLE_JS の --snapbar）はどちらもここから決める（2026-11-12：1000 幅で題が帯に隠れ・版面が画面に入らなかった） */

section.sec.has-emb{scroll-margin-top:calc(var(--snapbar) + max(var(--snapgap,24px),calc(var(--embov,0px) + 6px)))}  /* 小元素の上の端で吸着する（E4）。上の版面との間はあけない：吸着した時に上の版面の縁が見え、小元素がその上に立つ（2026-11-11 店長「上一个板块的边缘也显示出来会更有立体感」） */
.spot,.front .poster,#picks{--snapbar:var(--bar-tabs)}   /* 版面の外（トップ・気になるかも？）では帯は板块の段だけ */
.spot,.front .poster{scroll-margin-top:calc(var(--snapbar) + 16px)}
.page{max-width:1480px;display:grid;grid-template-columns:268px minmax(0,1fr);gap:28px 32px;align-items:start}
.mast{grid-column:1/-1}
.issues{display:flex;flex-direction:column;gap:28px;min-width:0}
.nav{position:sticky;top:0;display:flex;flex-direction:column;z-index:50}
.nav .pill{display:flex;align-items:center;gap:8px;position:relative;text-decoration:none}
.nav .pill .no{font:700 10px var(--font-mono);font-style:normal;font-variant-numeric:tabular-nums}
.nav a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* 作品のアイコン：items.yaml の emblem → 記事の写真 → 板块色の丸に頭文字。板块のアイコンは twemoji */
.nav .ic{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;overflow:hidden;
 background:var(--img,none) center/cover no-repeat,var(--sc);color:#FFF;font:900 10px/1 var(--font-sans);font-style:normal}
.nav .ic.has{color:transparent;background-color:var(--card)}
.nav .si{flex:none;width:18px;height:18px}
.nav .x{display:none!important}   /* v6 で隠した行（NAV_JS が付け外し） */
.nav .bar,.nav .mtabs{display:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.nav *{transition:none!important}}
/* 宽屏：目录占左栏从页面最上面开始（报头只在右栏），上下滚动时位置都不动。
   页面底部的留白挪进右栏，滚到底时目录也不会被顶上去 */
@media (min-width:1001px){
 .page{padding-bottom:0}.mast{grid-column:2;grid-row:1}.issues{grid-column:2;grid-row:2;padding-bottom:40px}
 .nav{grid-column:1;grid-row:1/3}}
/* 窄屏：顶部两排横条。上排是板块，下排是现在这个板块的作品（v6 的隐藏规则不用，简单就好） */
@media (max-width:1000px){
 .page{grid-template-columns:minmax(0,1fr)}
 .nav{top:env(safe-area-inset-top,0px);background:var(--ink);color:var(--card);padding:8px 0 0;margin:0 -24px}
 .nav .nhead,.nav .navwish,.nav .logo{display:none}
 .nav .mtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 16px 10px}
 .nav .mtabs::-webkit-scrollbar,.nav .rail::-webkit-scrollbar{display:none}
 .nav .mtabs a{flex:none;padding:4px 12px;font-size:13px;opacity:.55;text-decoration:none}
 .nav .mtabs a.on{opacity:1;box-shadow:3px 3px 0 var(--gold)}
 .nav .rail{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 16px;border-top:1px solid rgba(251,248,241,.18)}
 .nav:not(.insec) .rail{display:none}
 .nav .nslot{display:none}
 .nav .nslot.cur,.nav .nbody{display:contents}
 .nav .nsec,.nav .nsubs,.nav .nlab,.nav .nmore{display:none!important}
 .nav .pill{display:flex!important;flex:none;padding:5px 10px;border:1px solid rgba(251,248,241,.35);color:var(--card);
  font:700 13px/1.3 var(--font-sans);white-space:nowrap}
 .nav .pill .no,.nav .pill .ic,.nav .pill .cnt,.nav .pill .new,.nav .pill .br,.nav .pill .xref{display:none}
 .nav .pill.media,.nav .nsum{display:none!important}   /* スマホの横帯にはシリーズの中身・作品名の行を出さない */
 .nav .pill.on{background:var(--card);color:var(--ink);border-color:var(--card)}
 .nav .bar{display:block;position:absolute;left:0;bottom:0;height:3px;background:var(--cur,var(--alert));width:calc(var(--prog,0) * 100%)}
 :root{--bar-tabs:46px;--bar-full:94px}   /* NAV_JS が実測するまでの仮の値 */
 [data-k]{--snapgap:10px}   /* 帯の下の余白（スマホは今までの 104px と同じ位置） */
}
@media (max-width:600px){.nav{margin:0 -16px}}
@media (min-width:761px) and (max-width:1000px){.pk .why small{white-space:normal}}   /* 1000 幅前後：理由の行を「…」で切らない（D3）。高さは fitPk が測る */

 font:900 12px var(--font-sans);letter-spacing:.25em}

.wcard.solo h3{font-size:36px}
.wcard .price{font:900 30px/1 var(--font-sans);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.wcard .price small{font:700 14px var(--font-mono);margin-right:6px;opacity:.7}
.wcard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.wcard dt{font:700 11px var(--font-mono);letter-spacing:.15em;opacity:.6;padding-top:2px}
.wcard dd{margin:0}
.wcard .note{margin:0;font-size:15px;line-height:1.7;opacity:.85}
.wcard .links{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font:700 12px var(--font-mono);letter-spacing:.08em}
.wcard .links a{border-bottom:2px solid var(--acc);padding-bottom:1px}
.wcard .links a:hover{color:var(--acc)}
.wcard .watch{display:flex;flex-direction:column;gap:4px;padding:12px 14px;background:color-mix(in srgb,var(--acc) 8%,transparent);border-left:3px solid var(--acc);font-size:14px;line-height:1.55}
.wcard .watch span{font:700 11px var(--font-mono);letter-spacing:.2em;color:var(--acc)}
.wcard .added{font:700 11px var(--font-mono);opacity:.5;letter-spacing:.1em}
@media (max-width:760px){.wcard.solo{grid-template-columns:1fr}.wcard.solo .wimg{min-height:0;aspect-ratio:1/1}
 .wcard.solo .wtxt{border-left:0;padding:22px}.wcard.solo h3{font-size:28px}.wish .band .title{font-size:30px}}

.thpick .throw{display:flex;flex-wrap:wrap;gap:10px}
.thpick button{display:flex;align-items:center;gap:8px;min-height:40px;padding:6px 12px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font:700 13px var(--font-sans);cursor:pointer;box-shadow:3px 3px 0 var(--ink)}

:root{--app:480px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans)}
.scr{min-height:100vh;min-height:100dvh;display:none;flex-direction:column}
.scr.on{display:flex}
.wrap{width:min(var(--app),100%);margin:0 auto;padding:20px 16px 28px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px;flex:1}
/* ---- ① 入口 ---- */
#s-home .wrap{width:min(1100px,100%);gap:28px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:32px;align-items:center;padding-top:16px}
.logo{display:inline-block;align-self:flex-start;margin:0;background:var(--card);border:3px solid var(--ink);box-shadow:var(--shadow-l);
 padding:10px 18px;transform:rotate(var(--tilt));font:900 clamp(30px,5vw,52px)/1.1 var(--font-sans);letter-spacing:.02em;white-space:nowrap}
.catch{margin:18px 0 0;font:900 clamp(20px,2.6vw,26px)/1.5 var(--font-sans)}
.catch em{font-style:normal;background:linear-gradient(transparent 62%,var(--gold) 62%)}
.lede{margin:10px 0 0;font-size:15px;line-height:1.8;opacity:.85}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border:3px solid var(--ink);background:var(--card);
 color:var(--ink);font:900 16px var(--font-sans);text-decoration:none;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s}
.btn:hover,.btn:focus-visible{transform:translate(-2px,-2px)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.main{background:var(--rose);color:var(--card)}
.btn.sub{background:transparent;box-shadow:none;border-width:2px;font-size:14px;min-height:42px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn[hidden]{display:none}
.shot{position:relative}
.shot .pc{width:100%;border:3px solid var(--ink);box-shadow:var(--shadow-l);display:block;transform:rotate(1.2deg);background:var(--card)}
.shot .sp{position:absolute;right:-10px;bottom:-26px;width:26%;border:3px solid var(--ink);box-shadow:var(--shadow);transform:rotate(-3deg);background:var(--card)}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:18px 0 0;padding:0}
.how li{list-style:none;background:var(--card);border:2px solid var(--ink);box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.how b{font:900 17px/1.4 var(--font-sans)}
.how .n{font:400 30px/1 var(--font-num);color:var(--rose)}
.how p{margin:0;font-size:14px;line-height:1.7;opacity:.85}
.how ul{padding:0;margin:0;display:contents}
.pop{align-self:flex-start;position:relative;background:var(--card);box-shadow:var(--shadow);padding:10px 16px;transform:rotate(-2deg);font:20px/1.4 var(--font-hand)}
.foot{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;opacity:.8}
.foot a{color:inherit}
.back-on{display:none;align-items:center;gap:10px;background:var(--ink);color:var(--card);padding:10px 14px;font-size:14px}
.back-on.on{display:flex}
.back-on a{color:var(--gold);font-weight:900}
/* ---- 手順の画面（スマホ 1 枚の大きさ） ---- */
.bar{display:flex;align-items:center;gap:10px}
.bar button{border:0;background:none;font:900 22px var(--font-sans);cursor:pointer;color:var(--ink);padding:4px 8px}
.dots{display:flex;gap:6px;flex:1;justify-content:center}
.dots i{width:28px;height:6px;background:var(--hair)}
.dots i.on{background:var(--rose)}
.q{margin:6px 0 0;font:900 24px/1.4 var(--font-sans)}
.qs{margin:0;font-size:14px;line-height:1.7;opacity:.8}
.field{display:flex;flex-direction:column;gap:6px;font-weight:700}
.field input{padding:12px 14px;border:3px solid var(--ink);background:var(--card);font:700 18px var(--font-sans);color:var(--ink);min-width:0}
.hint{min-height:1.5em;margin:0;font-size:13px}
.hint.ok{color:var(--good)}.hint.ng{color:var(--alert)}
.agree{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:2px solid var(--ink);padding:12px 14px;font-size:14px;line-height:1.6}
.agree input{width:20px;height:20px;flex:none;margin-top:2px}
.agree a{color:var(--rose)}
.grow{flex:1}
.genres{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.genre{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border:3px solid var(--ink);background:var(--card);
 cursor:pointer;text-align:left;font:900 16px/1.3 var(--font-sans);color:var(--ink);box-shadow:var(--shadow)}

.genre small{font:700 var(--fs-tag)/1 var(--font-mono);letter-spacing:.12em;opacity:.7}
.genre[aria-pressed=true]{background:var(--sc);color:var(--card);transform:rotate(-1deg)}

.also{display:flex;flex-wrap:wrap;gap:10px}
.also label{display:flex;align-items:center;gap:6px;padding:8px 12px;border:2px solid var(--ink);background:var(--card);font-weight:700;cursor:pointer}
.also label[hidden]{display:none}
.sub-q{margin:8px 0 0;font:900 16px var(--font-sans)}
.more{border:2px solid var(--ink);background:var(--card)}
.more>summary{cursor:pointer;padding:10px 14px;font-weight:900;list-style:none}
.more>summary::-webkit-details-marker{display:none}

.more .row button[aria-pressed=true]{background:var(--ink);color:var(--card)}

.soon{font-size:11px;opacity:.7;font-weight:500}
.err{margin:0;color:var(--alert);font-weight:700;min-height:1.4em}

#s-cards .wrap{gap:12px}
@media (max-height:820px){#s-cards .qs{display:none}}

.card .tx{padding:12px 16px 14px;display:flex;flex-direction:column;gap:4px;border-top:3px solid var(--ink)}
.card .tx b{font:900 20px/1.35 var(--font-sans);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .tx span{font-size:13px;opacity:.8}
.card .sec{position:absolute;top:12px;left:12px;background:var(--sc);color:var(--card);padding:3px 10px;font:900 var(--fs-label)/1.6 var(--font-sans);transform:skewX(var(--skew))}
.card .mine{position:absolute;top:12px;right:12px;background:var(--card);padding:5px 10px;box-shadow:var(--shadow);transform:rotate(3deg);font:15px/1.2 var(--font-hand)}
.card .st{position:absolute;top:40%;left:50%;padding:6px 16px;border:4px solid currentColor;font:900 30px/1 var(--font-sans);opacity:0;pointer-events:none;background:var(--card)}
.card .st.y{color:var(--rose);transform:translate(-50%,-50%) rotate(-12deg)}
.card .st.n{color:var(--ink);transform:translate(-50%,-50%) rotate(12deg)}
.card.out-r{transform:translateX(130%) rotate(18deg);opacity:0}
.card.out-l{transform:translateX(-130%) rotate(-18deg);opacity:0}
.empty{text-align:center;font-size:15px;line-height:1.8}
.acts{display:flex;justify-content:center;gap:22px}
.act{width:68px;height:68px;border-radius:50%;border:3px solid var(--ink);background:var(--card);font:900 26px/1 var(--font-sans);cursor:pointer;box-shadow:var(--shadow);color:var(--ink)}
.act.y{background:var(--rose);color:var(--card)}
.act:active{transform:translate(2px,2px);box-shadow:none}
.count{text-align:center;font:700 13px var(--font-mono);opacity:.75}
/* 確認 */
.picked{display:flex;flex-direction:column;gap:10px;padding:0;margin:0}
.picked li{list-style:none;display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--ink);padding:8px 10px}
.picked img{width:48px;height:48px;object-fit:cover;flex:none;border:2px solid var(--ink)}
.picked b{flex:1;min-width:0;font-size:15px;overflow-wrap:anywhere}
.picked .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.picked small{display:block;font-weight:500;font-size:12px;opacity:.75}
.picked button{border:2px solid var(--ink);background:transparent;font:700 13px var(--font-sans);padding:4px 10px;cursor:pointer;color:var(--ink)}
.picked li.off{opacity:.45}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding-top:40px}
.done .pop{align-self:center;font-size:26px}
.done p{margin:0;line-height:1.8}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:0;margin:0}
.chips li{list-style:none;max-width:16em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--card);border:2px solid var(--ink);padding:3px 10px;font-weight:700;font-size:13px}
.proto{font:700 12px var(--font-mono);background:var(--gold);color:var(--ink);padding:4px 10px;align-self:center}
@media (max-width:820px){
 .hero{grid-template-columns:1fr;gap:26px}
 .shot{margin:0 6px 30px}
 .how{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.card,.btn{transition:none}}

body{min-height:100vh;min-height:100dvh;display:flex}
.nf{width:min(560px,100%);margin:auto;padding:32px 16px;box-sizing:border-box;display:flex;flex-direction:column;gap:20px;align-items:flex-start}
.nf .code{font:900 clamp(72px,22vw,120px)/1 var(--font-sans);margin:0;letter-spacing:.02em;text-shadow:5px 5px 0 var(--rose)}
.nf .catch{margin:0}
.nf .acts{display:flex;flex-wrap:wrap;gap:14px}
