<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script>
(function(){
  if(!window.fetch||window.WL_SB) return;
  var of=window.fetch.bind(window), R=document.documentElement, K='wl-sb-down', down=false, paused=false, downAt=0, lastGet=null, probing=false, RETRY=600000, READ=/\/rpc\/(get_[a-z_]+|my_votes|my_votes_own|live_boards|my_role|my_page|my_boards|can_edit|is_admin|auth_enforced|admin_(accounts|account_langs|board_edit_state|follow_detail|follow_rows|list_invites|ui_langs|users|votes))(\?|$)/;
  var MSG='いま、ログインと 👍👎 の機能を休止しています。記事はこれまでどおり読めます。';
  function sb(u){return /^https:\/\/[a-z0-9]+\.supabase\.co\/(rest|auth|functions)\//.test(u);}
  try{ var t=+sessionStorage.getItem(K); if(t&&Date.now()-t<RETRY){ down=true; paused=true; downAt=t; } }catch(e){}
  function note(){
    if(document.querySelector('.wl-sbnote')) return;
    if(!document.body){ document.addEventListener('DOMContentLoaded',note); return; }
    var s=document.createElement('style');
    s.textContent='.wl-sbnote{position:fixed;left:12px;bottom:12px;z-index:80;max-width:min(560px,calc(100vw - 24px));padding:6px 12px;border:2px solid var(--ink,#111);background:var(--gold,#ffd84a);color:var(--ink,#111);box-shadow:3px 3px 0 var(--ink,#111);font:700 13px/1.5 var(--font-sans,sans-serif)}@media(max-width:700px){.wl-sbnote{bottom:68px}}';   // 狭い画面は右下の札（ログイン）の上へ
    document.head.appendChild(s);
    var d=document.createElement('div'); d.className='wl-sbnote'; d.setAttribute('role','status'); d.textContent=MSG; document.body.appendChild(d);
    var el=document.getElementById('sb-state'); if(el){ el.dataset.state='limited'; el.textContent='Supabase：制限中（この画面で通信が止まりました）'; }
  }
  function trip(code){
    if(down&&R.dataset.sb) return;
    down=true; downAt=Date.now(); R.dataset.sb='down';
    if(code===402){ try{ sessionStorage.setItem(K,String(Date.now())); }catch(e){} }
    note();
  }
  if(paused){ R.dataset.sb='down'; note(); }
  // 制限が終わったら元に戻る（2026-11-03）：休止から 10 分たって、触る・タブに戻ったとき、最後に見た GET を 1 回だけ試す。
  // 通れば案内を消し、入力中でなければ読み直す（ページの JS は最初からやり直す）。まだ 402 なら 10 分待つ。放置のタブは触らないので呼ばない
  function up(){
    down=false; paused=false; delete R.dataset.sb; try{ sessionStorage.removeItem(K); }catch(e){}
    var n=document.querySelector('.wl-sbnote'); if(n) n.remove();
    var a=document.activeElement; if(!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) location.reload();
  }
  function recover(){
    if(!down||probing||!lastGet||Date.now()-downAt<RETRY) return;
    probing=true;
    of(lastGet[0],lastGet[1]).then(function(r){ probing=false;
      if(r.status===402||r.status>=520){ downAt=Date.now(); if(r.status===402){ try{ sessionStorage.setItem(K,String(downAt)); }catch(e){} } } else up();
    },function(){ probing=false; downAt=Date.now(); });
  }
  // 放置したタブの見回りを止める（2026-11-03）：見回り（setInterval の代わり）は every(fn, ms|関数) 1 本。触らない 10 分を超えたら
  // 5 分おき以上、30 分で止まる。触る・スクロール・タブに戻る で止まっていた分をすぐ 1 回読んで再開する。呼ぶ側は直さなくてよい
  var last=Date.now(), ps=[], IDLE1=600000, IDLE2=1800000;
  function every(fn,ms){
    var p={t:0,fn:fn};
    function gap(){var i=Date.now()-last,m=typeof ms==='function'?ms():ms;return i>=IDLE2?-1:(i>=IDLE1?Math.max(m,300000):m);}
    p.loop=function(){clearTimeout(p.t);var g=gap();if(g<0)return;
      p.t=setTimeout(function(){if(!document.hidden&&!down)p.fn();p.loop();},g);};
    ps.push(p);p.loop();
  }
  function touch(){var was=Date.now()-last>=IDLE1;last=Date.now();recover();
    if(was)ps.forEach(function(p){if(!document.hidden&&!down)p.fn();p.loop();});}
  ['pointerdown','keydown','touchstart','wheel','scroll'].forEach(function(e){addEventListener(e,touch,{passive:true,capture:true});});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)touch();});
  window.WL_SB={isDown:function(){return down;},every:every};
  window.fetch=function(input,init){
    var u=typeof input==='string'?input:(input&&input.url)||'';
    if(!sb(u)) return of(input,init);
    if(typeof input==='string'&&(!init||!init.method||init.method==='GET'||READ.test(u))) lastGet=[u,init];   // 試しに使うのは読むだけの呼び出し（GET と読む RPC）
    if(down) return Promise.resolve(new Response('{"message":"いま、ログインの機能を休止しています"}',{status:503,headers:{'Content-Type':'application/json'}}));
    return of(input,init).then(function(r){ if(r.status===402||r.status>=520) trip(r.status); return r; },function(e){ trip(0); throw e; });
  };
})();
</script>

<script>
(function(){
  var C={"url": "https://elegy.tailc8cfff.ts.net", "key": "sb_publishable_GMIrDWafyZ2-NKp_YVOd9Z_SijEusJ4", "lib": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"};
  var SUB=(/[?&]p=(settings|heat|wishlist)\b/.exec(location.search)||[])[1]||'', PG=SUB?SUB+'.html':'index.html';   // どのページか（AUTH_JS の ownPage）
  function back(q){try{var h=JSON.parse(sessionStorage.getItem('wl-own-at')||'[]').filter(function(x){return Date.now()-x<30000;});h.push(Date.now());sessionStorage.setItem('wl-own-at',JSON.stringify(h));}catch(_){}
    location.replace('./'+(SUB?PG:'')+(q||'')+location.hash);}
  // 上限 12 秒：つながらないまま「読み込み中」を出し続けない（F6 2026-11-05：10 回に 1 回 40 秒以上）→ 前の画面へ
  var done=0,T=setTimeout(function(){if(!done){done=1;back('?own=0');}},12000);
  var s=document.createElement('script');s.src=C.lib;s.onerror=function(){back('?own=0');};
  s.onload=function(){
    var sb=window.supabase.createClient(C.url,C.key,{auth:{persistSession:true,storageKey:'wl-auth',detectSessionInUrl:false}});
    sb.auth.getSession().then(function(r){
      var se=r&&r.data&&r.data.session;if(!se){back('');return null;}
      // 置き場の名前は人ごとに決まっていて変わらない：同じ人なら前に聞いた名前を使い、my_page_path を毎回呼ばない（F6）
      var uid=se.user&&se.user.id,kp='wl-own-path',kn=null;try{kn=JSON.parse(localStorage.getItem(kp)||'null');}catch(_){}
      var path=kn&&kn.u===uid&&kn.p?Promise.resolve({data:kn.p}):sb.rpc('my_page_path');
      return path.then(function(p){
        if(p.error||!p.data){back('?own=0');return null;}
        try{localStorage.setItem(kp,JSON.stringify({u:uid,p:p.data}));}catch(_){}
        return sb.storage.from('pages').download(p.data+'/'+PG);
      });
    }).then(function(d){
      if(!d)return;
      if(done)return;
      if(d.error||!d.data){try{localStorage.removeItem('wl-own-path');}catch(_){}back('?own=0');return;}
      return d.data.text().then(function(h){
        if(done)return;
        if(h.indexOf('name="wl-own"')<0){back('?own=0');return;}
        done=1;clearTimeout(T);document.open();document.write(h);document.close();
        try{history.replaceState(null,'','./'+(SUB?PG:'')+location.hash);}catch(_){}
      });
    }).catch(function(){back('?own=0');});
  };
  document.head.appendChild(s);
})();
</script></body></html>
