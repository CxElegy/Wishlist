<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>目次の収め方テスト</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* テストグラウンド：作品が 20 / 100 / 1000 件になったときの左の目次。トークンは scripts/render.py の :root と同じ */
:root{--ink:#1A1C22;--paper:#EDEBE6;--rose:#B8336A;--sheet:#F4EDE4;--card:#FBF8F1;--gold:#FFD23F;--alert:#D7261E;
 --font-sans:'Noto Sans JP',sans-serif;--font-mono:'JetBrains Mono',monospace;--fs-label:11px;
 --shadow:4px 4px 0 var(--ink);--skew:-8deg;--hair:color-mix(in srgb,var(--ink) 16%,transparent);--muted:rgba(26,28,34,.62);--navw:268px}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;background:var(--paper);color:var(--ink);font:500 15px/1.6 var(--font-sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.tg{display:inline-block;flex:none;white-space:nowrap;background:var(--sc,var(--ink));color:#FFF;padding:0 9px;transform:skewX(var(--skew));
 font:900 12px/1.6 var(--font-sans);letter-spacing:.06em}

/* ---------- 上の操作バー ---------- */
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:14px 24px;background:var(--ink);color:var(--card)}
.ctl h1{margin:0;font:900 16px/1.3 var(--font-sans);letter-spacing:.04em}
.ctl h1 small{display:block;font:700 var(--fs-label) var(--font-mono);letter-spacing:.2em;color:var(--gold)}
.seg{display:flex;border:2px solid var(--card)}
.seg button{padding:4px 12px;font:700 13px var(--font-mono)}
.seg button[aria-pressed=true]{background:var(--gold);color:var(--ink)}
.ctl label{display:flex;align-items:center;gap:6px;font:700 13px var(--font-sans)}
.ctl .note{flex-basis:100%;margin:0;font:500 12px/1.6 var(--font-sans);color:rgba(251,248,241,.75)}

/* ---------- 骨格 ---------- */
.wrap{display:grid;grid-template-columns:var(--navw) minmax(0,1fr);gap:28px;max-width:1240px;margin:0 auto;padding:0 24px 0 0}
main{padding:24px 0 60vh}

/* ---------- 左の目次 ---------- */
.nav{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;border-left:6px solid var(--alert);padding:14px 0 10px 12px}
.nav .find{display:flex;align-items:center;gap:8px;margin:0 8px 10px 0;padding:7px 10px;border:2px solid var(--ink);background:var(--card);
 box-shadow:3px 3px 0 var(--ink);font:700 13px var(--font-sans);color:var(--muted)}
.nav .find kbd{margin-left:auto;font:700 11px var(--font-mono);border:1px solid var(--hair);padding:0 5px}
.rail{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;padding:0 8px 12px 0}
.rail .pill{display:flex;align-items:center;gap:8px;width:100%;min-height:30px;padding:3px 6px 3px 8px;position:relative;isolation:isolate;
 text-align:left;color:rgba(26,28,34,.78);font:700 13px/1.35 var(--font-sans)}
.rail .pill::before{content:"";position:absolute;inset:1px -2px 1px -4px;z-index:-1;transform:skewX(var(--skew))}
.rail .pill:hover::before{background:rgba(26,28,34,.08)}
.rail .pill .no{font:700 10px var(--font-mono);color:var(--sc);min-width:2.4em}
.rail .pill .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail .pill .new{flex:none;font:700 10px var(--font-mono);color:var(--alert)}
.rail .pill.on{color:var(--card);font-weight:900}
.rail .pill.on::before{background:var(--ink);box-shadow:4px 4px 0 var(--alert)}
.rail .pill.on .no{color:var(--gold)}
.rail .pill.on .new{color:var(--gold)}
/* 板块の行：色の平行四辺形 + 件数 + 新着の割合バー。たたんでも「どこに新着があるか」が見える */
.sec{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 8px;width:100%;margin-top:10px;padding:4px 4px 4px 0;text-align:left}
.sec .cnt{font:700 11px var(--font-mono);color:var(--muted);text-align:right}
.sec .chev{font:700 11px var(--font-mono);color:var(--sc);transition:transform .15s}
.sec[aria-expanded=true] .chev{transform:rotate(90deg)}
.sec .meter{grid-column:1/-1;height:4px;background:var(--hair);position:relative}
.sec .meter i{position:absolute;inset:0 auto 0 0;background:var(--sc)}
.sec .en{font:700 10px var(--font-mono);letter-spacing:.2em;color:var(--muted)}
.sec.cur .tg{box-shadow:3px 3px 0 var(--ink)}
.subs{margin:2px 0 4px 6px;border-left:2px solid var(--sc);padding-left:6px}
.sub{display:flex;align-items:center;gap:8px;width:100%;padding:3px 4px;text-align:left;font:700 12px/1.4 var(--font-sans);color:var(--muted)}
.sub .cnt{margin-left:auto;font:700 10px var(--font-mono)}
.sub:hover{color:var(--ink)}
.sub[aria-expanded=true]{color:var(--sc);font-weight:900}
.sub .chev{font:700 10px var(--font-mono);transition:transform .15s}
.sub[aria-expanded=true] .chev{transform:rotate(90deg)}
.items{margin:0 0 4px}
.more{display:block;width:100%;padding:3px 8px 3px 40px;text-align:left;font:700 12px var(--font-sans);color:var(--sc)}
.more:hover{text-decoration:underline}
.grp-h{display:flex;align-items:center;gap:8px;margin:12px 0 2px;font:900 11px var(--font-mono);letter-spacing:.2em;color:var(--alert)}

/* ---------- 本文（テスト用のダミー版面） ---------- */
.shead{height:84px;display:flex;align-items:flex-end;gap:12px;padding-bottom:12px}
.shead .tg{font-size:20px;padding:2px 16px;box-shadow:var(--shadow)}
.shead small{font:700 12px var(--font-mono);letter-spacing:.2em;color:var(--muted)}
.blk{height:220px;margin:0 0 20px;background:var(--card);border-top:6px solid var(--sc);padding:14px 18px;content-visibility:auto;contain-intrinsic-size:auto 220px}
.blk h3{margin:0;display:flex;align-items:baseline;gap:10px;font:900 20px/1.3 var(--font-sans)}
.blk h3 .no{font:700 12px var(--font-mono);color:var(--sc)}
.blk .path{font:700 11px var(--font-mono);color:var(--muted);letter-spacing:.08em}
.blk .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.blk .cards i{height:96px;background:color-mix(in srgb,var(--sc) 14%,var(--sheet))}

/* ---------- 検索（全作品の一覧） ---------- */
dialog{width:min(920px,calc(100vw - 32px));max-height:calc(100vh - 48px);padding:0;border:3px solid var(--ink);background:var(--card);color:var(--ink);box-shadow:8px 8px 0 var(--ink)}
dialog::backdrop{background:rgba(26,28,34,.55)}
.fd{display:flex;flex-direction:column;max-height:calc(100vh - 54px)}
.fd .top{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:2px solid var(--ink)}
.fd input{flex:1;min-width:0;font:700 16px var(--font-sans);padding:8px 10px;border:2px solid var(--ink);background:#FFF}
.fd .x{font:900 18px var(--font-sans);padding:4px 10px}
.fd .chips{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--hair)}
.fd .chips button{opacity:.45}
.fd .chips button[aria-pressed=true]{opacity:1}
.fd .res{overflow-y:auto;padding:4px 16px 16px}
.fd h4{margin:14px 0 6px;display:flex;align-items:center;gap:10px;font:900 13px var(--font-sans)}
.fd h4 small{font:700 11px var(--font-mono);color:var(--muted)}
.fd .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px 12px}
.fd .grid a{display:flex;gap:6px;align-items:baseline;padding:3px 4px;font:700 13px/1.4 var(--font-sans);border-bottom:1px solid var(--hair)}
.fd .grid a:hover{background:var(--sheet)}
.fd .grid a .new{margin-left:auto;font:700 10px var(--font-mono);color:var(--alert)}
.fd .empty{padding:24px 0;color:var(--muted)}

/* ---------- 狭い画面：上に 2 段の横帯（板块 → いまの板块の作品） ---------- */
@media (max-width:760px){
 .ctl{padding:12px 16px}
 .wrap{display:block;padding:0 16px}
 .nav{top:0;height:auto;z-index:20;margin:0 -16px;padding:6px 0 0;border-left:0;background:var(--ink);color:var(--card)}
 .nav .find{display:none}
 .rail{display:none}
 .mrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 16px 8px}
 .mrow::-webkit-scrollbar{display:none}
 .mrow .tg{padding:4px 12px;font-size:13px;opacity:.55}
 .mrow .tg.cur{opacity:1;box-shadow:3px 3px 0 var(--gold)}
 .mrow.items2{border-top:1px solid rgba(251,248,241,.18);padding-top:8px}
 .mrow .chip{flex:none;padding:5px 10px;border:1px solid rgba(251,248,241,.35);font:700 13px/1.3 var(--font-sans);white-space:nowrap}
 .mrow .chip.on{background:var(--card);color:var(--ink);border-color:var(--card)}
 .mrow .chip.lead{background:var(--sc);border-color:var(--sc);color:#FFF}
 .blk .cards{grid-template-columns:1fr 1fr}
 .blk .cards i:nth-child(3){display:none}
 .blk h3{font-size:17px}
}
@media (min-width:761px){.mrow{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="ctl">
  <h1><small>TESTGROUND</small>目次の収め方テスト</h1>
  <div class="seg" role="group" aria-label="作品の数">
    <button data-n="20">20</button><button data-n="100">100</button><button data-n="1000">1000</button>
  </div>
  <label><input type="checkbox" id="onlynew">目次は新着ありだけ</label>
  <p class="note">作品はダミーです。〜24 件：全部ひらく（今と同じ）／ 25〜：いま読んでいる板块だけひらく ／ 板块が 12 件を超えると「小分類」の段が入る ／ 小分類が 8 件を超えると新着順に 8 件＋「ほか N 件」。全部は 🔍（キー「/」）から。</p>
</header>
<div class="wrap">
  <nav class="nav" aria-label="目次">
    <button class="find" id="findbtn" type="button">🔍 作品をさがす<kbd>/</kbd></button>
    <div class="rail" id="rail"></div>
    <div class="mrow" id="mrow1"></div>
    <div class="mrow items2" id="mrow2"></div>
  </nav>
  <main id="main"></main>
</div>
<dialog id="finder" aria-label="作品をさがす">
  <div class="fd">
    <div class="top"><input id="q" type="search" placeholder="作品名で絞り込む" autocomplete="off"><button class="x" id="fx" type="button" aria-label="閉じる">×</button></div>
    <div class="chips" id="fchips"></div>
    <div class="res" id="fres"></div>
  </div>
</dialog>
<script>
(() => {
  // ---------- ダミーデータ：板块 → 小分類 → 作品 ----------
  const SECS = [
    {id:'游戏', ja:'ゲーム', en:'GAMES', c:'#2F5BD3', w:22, subs:['任天堂','PlayStation','PC・Steam','スマホ','インディー']},
    {id:'影视', ja:'映像', en:'SCREEN', c:'#9B3FB5', w:20, subs:['海外ドラマ','映画','日本ドラマ','ドキュメンタリー']},
    {id:'好物', ja:'グッズ', en:'GOODS', c:'#985315', w:18, subs:['文房具','キッチン','猫用品','ガジェット','ファッション']},
    {id:'演出', ja:'ライブ', en:'LIVE', c:'#BB265A', w:12, subs:['J-POP','アイドル','フェス','舞台・ミュージカル']},
    {id:'运动', ja:'スポーツ', en:'SPORTS', c:'#156A48', w:8, subs:['サッカー','野球','バスケ','モータースポーツ']},
    {id:'动画', ja:'アニメ', en:'ANIME', c:'#3D5A80', w:10, subs:['今期','劇場版','長期シリーズ']},
    {id:'音乐', ja:'音楽', en:'MUSIC', c:'#5B4B8A', w:5, subs:['アーティスト','新譜','レーベル']},
    {id:'书籍', ja:'本・マンガ', en:'BOOKS', c:'#2F6F73', w:5, subs:['連載マンガ','小説','画集・ムック']},
  ];
  const A = ['星','月','夜','風','海','銀河','鋼','白','黒','紅','蒼','花','雪','炎','森','空','鏡','砂','雷','霧'];
  const B = ['の王国','クロニクル','ライン','の記憶','ブレイク','アーク','の彼方','ノート','シティ','ガーデン','ゼロ','レコード','の旅','ハウス','タワー'];
  const GOODS = ['マグ','ノート','ペン','トート','ランプ','キーボード','スピーカー','クッション','タンブラー','ポーチ'];
  const BRAND = ['ATELIER','KOBO','NORD','LUMEN','MOSS','ORBIT','PALM','TIDE'];

  function rng(seed) { return () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296; }
  function build(N) {
    const r = rng(N * 7 + 3), secs = N <= 24 ? SECS.slice(0, 5) : SECS;
    const tw = secs.reduce((s, x) => s + x.w, 0), used = new Set(), out = [];
    let left = N;
    secs.forEach((s, si) => {
      const n = si === secs.length - 1 ? left : Math.max(1, Math.round(N * s.w / tw));
      left -= n;
      for (let k = 0; k < n; k++) {
        let name;
        do {
          name = s.id === '好物' ? `${BRAND[r() * BRAND.length | 0]} ${A[r() * A.length | 0]}${GOODS[r() * GOODS.length | 0]}`
                                 : `${A[r() * A.length | 0]}${B[r() * B.length | 0]}`;
          if (used.has(name)) name += ' ' + (2 + (r() * 8 | 0));
        } while (used.has(name));
        used.add(name);
        const sub = s.subs[Math.min(s.subs.length - 1, Math.floor(Math.pow(r(), 1.3) * s.subs.length))];
        out.push({name, sec: s, sub, hot: r() < .35 ? 1 + (r() * 9 | 0) : 0});
      }
    });
    // 板块 → 小分類 の順に並べる（版面の順番もこれ）
    out.sort((a, b) => secs.indexOf(a.sec) - secs.indexOf(b.sec) || a.sec.subs.indexOf(a.sub) - b.sec.subs.indexOf(b.sub));
    out.forEach((w, i) => { w.i = i; w.no = String(i + 1).padStart(N >= 1000 ? 4 : N >= 100 ? 3 : 2, '0'); });
    return {secs: secs.filter(s => out.some(w => w.sec === s)), works: out};
  }

  // ---------- しきい値 ----------
  const FLAT_MAX = 24,     // これ以下なら全部ひらく（今のやり方）
        SUB_MIN = 13,      // 板块の作品がこれ以上なら「小分類」の段を入れる
        CAP = 8,           // ひらいた小分類で一度に見せる作品の数（新着順、今の作品は必ず入る）
        HOT_TOP = 5;       // 「いま話題」に出す数

  const $ = id => document.getElementById(id), e = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
  const rail = $('rail'), main = $('main'), m1 = $('mrow1'), m2 = $('mrow2'), dlg = $('finder');
  let D, cur = 0, open = new Set(), openSub = new Set(), tops = [], onlyNew = false;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sid = s => s.id, subKey = w => w.sec.id + '/' + w.sub;

  function load(N) {
    D = build(N);
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.n == N));
    let h = '', last = null;
    for (const w of D.works) {
      if (w.sec !== last) { last = w.sec; h += `<div class="shead" style="--sc:${w.sec.c}"><span class="tg">${e(w.sec.ja)}</span><small>${w.sec.en}</small></div>`; }
      h += `<section class="blk" id="w${w.i}" style="--sc:${w.sec.c}"><div class="path">${e(w.sec.ja)} › ${e(w.sub)}</div>`
         + `<h3><span class="no">${w.no}</span>${e(w.name)}</h3><div class="cards"><i></i><i></i><i></i></div></section>`;
    }
    main.innerHTML = h;
    measure(); cur = -1; open.clear(); openSub.clear();
    scrollTo(0, 0); spy(true);
  }
  function measure() { tops = D.works.map(w => document.getElementById('w' + w.i).offsetTop); }

  // ---------- 目次を描く ----------
  function pill(w) {
    return `<a class="pill${w.i === cur ? ' on' : ''}" style="--sc:${w.sec.c}" href="#w${w.i}" data-i="${w.i}">`
         + `<i class="no">${w.no}</i><span class="nm">${e(w.name)}</span>${w.hot ? `<span class="new">+${w.hot}</span>` : ''}</a>`;
  }
  function visible(list) {
    // 新着の多い順に CAP 件。今読んでいる作品は必ず入れる。並びは版面の順に戻す
    let pick = (onlyNew ? list.filter(w => w.hot) : list).slice().sort((a, b) => b.hot - a.hot || a.i - b.i).slice(0, CAP);
    const c = list.find(w => w.i === cur);
    if (c && !pick.includes(c)) pick = pick.slice(0, CAP - 1).concat(c);
    return pick.sort((a, b) => a.i - b.i);
  }
  function draw() {
    const W = D.works, flat = W.length <= FLAT_MAX, cw = W[cur];
    let h = '';
    if (!flat) {
      const hot = W.filter(w => w.hot).sort((a, b) => b.hot - a.hot).slice(0, HOT_TOP);
      h += `<div class="grp-h">● いま話題</div>` + hot.map(pill).join('');
    }
    for (const s of D.secs) {
      const list = W.filter(w => w.sec === s), nn = list.filter(w => w.hot).length;
      const isCur = cw && cw.sec === s, ex = flat || open.has(s.id) || isCur;
      h += `<button class="sec${isCur ? ' cur' : ''}" style="--sc:${s.c}" data-sec="${s.id}" aria-expanded="${ex}">`
         + `<span class="tg">${e(s.ja)}</span><span class="en">${s.en}</span><span class="cnt">${flat ? list.length : `新着 ${nn}／${list.length} <span class="chev">▸</span>`}</span>`
         + (flat ? '' : `<span class="meter"><i style="width:${Math.round(nn / list.length * 100)}%"></i></span>`) + `</button>`;
      if (!ex) continue;
      if (flat || list.length < SUB_MIN) {
        const show = flat ? list : (onlyNew ? list.filter(w => w.hot || w.i === cur) : list);
        h += `<div class="items">${show.map(pill).join('')}</div>`;
        continue;
      }
      h += `<div class="subs" style="--sc:${s.c}">`;
      for (const sub of s.subs) {
        const sl = list.filter(w => w.sub === sub);
        if (!sl.length) continue;
        const k = s.id + '/' + sub, sex = openSub.has(k) || (cw && subKey(cw) === k);
        h += `<button class="sub" data-sub="${e(k)}" aria-expanded="${!!sex}"><span class="chev">▸</span>${e(sub)}<span class="cnt">${sl.filter(w => w.hot).length}／${sl.length}</span></button>`;
        if (!sex) continue;
        const v = visible(sl);
        h += `<div class="items">${v.map(pill).join('')}`
           + (sl.length > v.length ? `<button class="more" data-scope="${e(k)}">ほか ${sl.length - v.length} 件をさがす →</button>` : '') + `</div>`;
      }
      h += `</div>`;
    }
    rail.innerHTML = h;
    const on = [...rail.querySelectorAll('.pill.on')].pop();   // 「いま話題」にも同じ作品が出ることがあるので、板块の中のほう
    if (on) rail.scrollTo({top: on.offsetTop - rail.clientHeight / 2 + on.offsetHeight / 2, behavior: 'auto'});
    drawMobile();
  }
  function drawMobile() {
    const W = D.works, cw = W[cur] || W[0];
    m1.innerHTML = D.secs.map(s => `<button class="tg${s === cw.sec ? ' cur' : ''}" style="--sc:${s.c}" data-jump-sec="${s.id}">${e(s.ja)}</button>`).join('');
    const list = W.filter(w => w.sec === cw.sec), big = list.length >= SUB_MIN;
    const near = big ? list.filter(w => w.sub === cw.sub) : list;
    m2.innerHTML = (big ? `<button class="chip lead" style="--sc:${cw.sec.c}" data-scope="${e(subKey(cw))}">${e(cw.sub)} ▾</button>` : '')
      + near.map(w => `<a class="chip${w.i === cur ? ' on' : ''}" href="#w${w.i}" data-i="${w.i}">${e(w.name)}</a>`).join('');
    for (const row of [m1, m2]) {
      const on = row.querySelector('.cur,.on');
      if (on) row.scrollTo({left: on.offsetLeft - row.clientWidth / 2 + on.offsetWidth / 2, behavior: 'auto'});
    }
  }

  // ---------- 今どこを読んでいるか（二分探索：1000 件でも軽い） ----------
  let ticking = false;
  function spy(force) {
    ticking = false;
    const nav = document.querySelector('.nav'), y = scrollY + (innerWidth <= 760 ? nav.offsetHeight : 0) + 90;
    let lo = 0, hi = tops.length - 1, k = 0;
    while (lo <= hi) { const m = (lo + hi) >> 1; if (tops[m] <= y) { k = m; lo = m + 1; } else hi = m - 1; }
    if (k !== cur || force) { cur = k; draw(); }
  }
  addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(() => spy()); } }, {passive: true});
  addEventListener('resize', () => { measure(); spy(true); });

  function go(i) {
    const el = document.getElementById('w' + i), off = innerWidth <= 760 ? document.querySelector('.nav').offsetHeight + 8 : 16;
    scrollTo({top: el.offsetTop - off, behavior: reduce || Math.abs(el.offsetTop - scrollY) > 6000 ? 'auto' : 'smooth'});
  }

  // ---------- クリック ----------
  document.addEventListener('click', ev => {
    const t = ev.target.closest('[data-i],[data-sec],[data-sub],[data-scope],[data-jump-sec],.seg button');
    if (!t) return;
    if (t.matches('.seg button')) return load(+t.dataset.n);
    ev.preventDefault();
    if (t.dataset.i != null) { if (dlg.open) dlg.close(); return go(+t.dataset.i); }
    if (t.dataset.scope) return finder(t.dataset.scope);
    if (t.dataset.jumpSec) return go(D.works.find(w => w.sec.id === t.dataset.jumpSec).i);
    if (t.dataset.sec) {   // 板块の行：たたむ / ひらく（今の板块は常にひらいたまま）
      const id = t.dataset.sec;
      open.has(id) ? open.delete(id) : open.add(id);
      return draw();
    }
    if (t.dataset.sub) { const k = t.dataset.sub; openSub.has(k) ? openSub.delete(k) : openSub.add(k); return draw(); }
  });
  $('onlynew').addEventListener('change', ev => { onlyNew = ev.target.checked; draw(); });

  // ---------- 🔍 全作品の一覧 ----------
  let fsec = null;
  function finder(scope) {
    $('q').value = '';
    fsec = scope ? scope.split('/')[0] : null;
    const sub = scope ? scope.split('/').slice(1).join('/') : '';
    $('fchips').innerHTML = `<button class="tg" style="--sc:var(--ink)" data-f="" aria-pressed="${!fsec}">すべて</button>`
      + D.secs.map(s => `<button class="tg" style="--sc:${s.c}" data-f="${s.id}" aria-pressed="${fsec === s.id}">${e(s.ja)}</button>`).join('');
    dlg.showModal();
    if (sub) $('q').value = sub;
    list();
    $('q').focus();
  }
  function list() {
    const q = $('q').value.trim().toLowerCase();
    let h = '', total = 0;
    for (const s of D.secs) {
      if (fsec && s.id !== fsec) continue;
      for (const sub of s.subs) {
        const hit = D.works.filter(w => w.sec === s && w.sub === sub && (!q || (w.name + ' ' + sub).toLowerCase().includes(q)));
        if (!hit.length) continue;
        total += hit.length;
        h += `<h4 style="--sc:${s.c}"><span class="tg">${e(s.ja)}</span>${e(sub)}<small>${hit.length} 件</small></h4><div class="grid">`
           + hit.map(w => `<a href="#w${w.i}" data-i="${w.i}"><span>${e(w.name)}</span>${w.hot ? `<span class="new">+${w.hot}</span>` : ''}</a>`).join('') + `</div>`;
      }
    }
    $('fres').innerHTML = total ? h : `<p class="empty">見つかりませんでした</p>`;
  }
  $('q').addEventListener('input', list);
  $('fchips').addEventListener('click', ev => {
    const b = ev.target.closest('[data-f]'); if (!b) return;
    fsec = b.dataset.f || null;
    $('fchips').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    list();
  });
  $('fx').addEventListener('click', () => dlg.close());
  $('findbtn').addEventListener('click', () => finder());
  addEventListener('keydown', ev => {
    if (ev.key === '/' && !dlg.open && document.activeElement.tagName !== 'INPUT') { ev.preventDefault(); finder(); }
  });

  const n0 = +(new URLSearchParams(location.search).get('n')) || 100;
  load([20, 100, 1000].includes(n0) ? n0 : 100);
})();
</script>
</body>
</html>
