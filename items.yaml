# 关注清单：只需要改这个文件，定时任务会自动读取。
#
# 通用字段：
#   name         必填，报告里显示的名字
#   type         product 商品 / category 一类产品 / game 游戏 / anime 动画漫画 / show 影视剧，默认 product
#   keywords     搜索关键词，每个词单独搜一次；建议写上各语言的正式名称
#   match        可选，标题或摘要必须包含其中一个词才保留，默认用 keywords
#   exclude      可选，标题包含这些词的条目直接丢掉
#   news_langs   可选，单独为这一项指定新闻语言区，会覆盖下面 settings 里的设置
#   use          可选，用哪些新闻源，默认 [google, bing]
#   subreddits   可选，在这些 Reddit 版块里按关键词搜
#   feeds        可选，任意 RSS / Atom 地址（官网博客、RSSHub 等）
#   max_entries  可选，单独为这一项设置交给 AI 的条目上限
#   notes        可选，给 AI 的补充说明
#
# 按类型的专用字段：
#   game   steam_appid   Steam 商店网址里的数字，用来抓官方公告和当前价格
#   anime  anilist_id    anilist.co 网址里的数字；不填就按 keywords 的第一个词搜索。
#                        填第一季也行，会自动追到最新一季
#          anilist_type  ANIME（默认）或 MANGA
#   show   tmdb          themoviedb.org 网址里的那一段，如 tv/1399 或 movie/693134
#                        需要在仓库 Secrets 里设置 TMDB_API_KEY（免费申请）

settings:
  lookback_days: 7              # 只看最近 N 天
  news_langs: [zh-CN, en-US]    # 默认的新闻语言区：zh-CN / zh-TW / en-US / ja-JP / ko-KR
  timezone: Asia/Shanghai       # 播出时间按这个时区显示
  steam_country: cn             # Steam 价格地区
  max_entries_per_item: 30      # 每个关注项最多交给 AI 的条目数（控制 token）
  summarize: true               # false = 不调用 AI，只列链接（完全零成本）
  model: claude-haiku-5-5       # 归纳用的模型
  create_issue: true            # 每期同时开一个 GitHub Issue（会邮件通知你）

items:
  - name: Astrae Oratio（アストラエ・オラティオ）
    type: game
    keywords: ["Astrae Oratio", "アストラエ・オラティオ", "아스트라에 오라티오", "阿索拉 星之祈願"]
    match: [Astrae Oratio, アストラエ・オラティオ, アスオラ, 아스트라에 오라티오, 아스오라, 阿索拉]
    news_langs: [zh-TW, en-US, ja-JP, ko-KR]
    max_entries: 40
    notes: >-
      NC 发行、Dynamis One 开发的新传奇魔法 RPG，舞台是架空的 1989 年东京。
      预计 2027 年登陆 iOS/Android，之后推出 PC 版。2026 年 10 月 2 日至 6 日进行过全球 CBT。
      重点关注：正式上线日期、测试/预约、新角色和 PV、PC 版和 Steam 页面消息。

