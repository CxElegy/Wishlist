      追踪漫威影业（MCU）的院线电影。已知背景（2026/10）：《复仇者联盟5：毁灭之日》原定 2026 年 5 月 1 日，
      已改到 2026 年 12 月 18 日北美上映（港台约 12 月 16 日），小罗伯特·唐尼饰演末日博士，罗素兄弟执导；
      9 月 28 日官宣引进中国内地，内地具体上映日期尚未公布。《蜘蛛侠：崭新之日》已于 2026 年 7 月 31 日上映。
      《复仇者联盟6：秘密战争》定于 2027 年 12 月 17 日。2028 年迪士尼占了 2 月 18 日、5 月 5 日、11 月 10 日三个未命名漫威档期，
      X 战警新片被传在其中，未官宣。漫威游戏（漫威争锋、Marvel Snap）、周边不算。
      “内鬼爆料”、选角传闻很多，没有漫威 / 迪士尼官方或主流媒体确认的都按传闻处理，标题注明「传闻」。
