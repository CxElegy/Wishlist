# 关注清单：只需要改这个文件，定时任务会自动读取。
#
# 通用字段：
#   name         必填，报告里显示的名字
#   type         product 商品 / category 一类产品 / game 游戏 / anime 动画漫画 / show 影视剧 / event 艺人演出，默认 product
#   keywords     搜索关键词，每个词单独搜一次；建议写上各语言的正式名称
#   match        可选，标题或摘要必须包含其中一个词才保留，默认用 keywords
#                「re:」开头的写正则，区分大小写（如 're:^From Season \d'），名字是常用英文词时用它；
#                泛词要和主题词同时出现时写 're:(?is)(?=.*(星巴克…))(?=.*(马克杯…))'。写法规则见 CLAUDE.md「匹配词（match）的写法」，
#                改完跑 python scripts/digest.py audit-match 看有没有误收
#   exclude      可选，标题包含这些词的条目直接丢掉
#   news_langs   可选，单独为这一项指定新闻语言区，会覆盖下面 settings 里的设置
#   priority          你最关心这一项的什么（用 AI 时生效）。AI 按它给报道排序，直接回答它的新消息会做成整行大板块
#   priority_keywords 不用 AI 时生效：标题含这些词的消息排在最前面做头条
#   urgent_patterns   要紧消息的判定（正则，匹配标题）。命中的消息当天立刻通知 Discord，并在简报里做成整行“重大”板块。
#                     Reddit / YouTube 的帖子不算，避免传闻误报
#   section      可选，头版上归到哪个板块：只能写 sections.yaml 里的 key（8 个大类：影视 作品 / 游戏 / 演出 音楽・ライブ / 运动 /
#                好物 ショッピング / 生活 暮らし・趣味 / 出行 おでかけ・アート / 其他），不临时开新板块。旧的 17 个板块名会自动换成大类
#                不填按 type：game → 游戏，anime / show → 影视，event → 演出，product / category → 好物
#   subs         必填，板块里的小分类，按「分け方」各写一个：{status: 運営中, platform: スマホ}（分け方和常用的值见 sections.yaml）。
#                用哪个分け方由 ⚙ 设置页选（板块ごと）。每个分け方都要写，哪怕只有这一项；左边目录一定出小分类的札。（旧的 sub: 也还认）
#   parent       可选，上级关注项的名字（スパイダーマン → parent: 漫威电影）。只做一层。目录上下级挂在上级下面的支线上（大小一样、不折叠），
#                同一条新闻上下级都收到时只放进下级的版面。加关注项时先判断上下级，规则见 CLAUDE.md「新增关注项时：判断上下级」
#   icon         可选，左边目录的图标（只给正在读的作品显示，1 个作品 1 张）：{image: icons/xx.webp, kind, why, source}。
#                和 emblem（版面右上角的角色贴纸，可以多张随机）不同，要的是「一眼认出是哪个作品 / 牌子」的那一张。选法见 CLAUDE.md「目次のアイコン」
#   similar      可选，主页「我会喜欢？」用：同类新东西的搜索词，每条 {label: 同类名, lang: 语言区, query: 搜索词, need: [...]}。
#                need 里每一项都必须在标题或摘要里出现（一项里用 | 写几种说法，命中一种就算），用来去掉不相关的
#                每天搜一次，已经在关注清单里的作品会被去掉，剩下的推荐给你
#   subtitle     可选，板块标题旁的副标题（如日文名）
#   status       可选，一句话现状。本期没有新消息时，该项只留一个小栏，显示这句话和往期最近一条
#   use          可选，用哪些来源，默认 [google, bing, reddit]
#   subreddits   可选，额外在这些 Reddit 版块里按关键词搜
#   feeds        可选，任意 RSS / Atom 地址（官网博客、RSSHub 等）
#   max_entries  可选，单独为这一项设置交给 AI 的条目上限
#   max_stories  可选，这一项每期最多几条报道（只挑最火的；事情少就少写，不凑数）。
#                篇幅 S / M / L 在数据库 sizes 表里管理（db/sizes.sql），表里有这一项时以数据库为准
#   size         可选，篇幅 S（少，每期 3 条、网页约一行）/ M（中等，5 条，默认）/ L（多，8 条、满满一整屏）。
#                不用去数据库手动加：新关注项会自动写进 sizes 表；这里改了也会同步过去。在数据库里改的，这里不再改就以数据库为准
#   exclude_sources 可选，这些来源（媒体名）的条目直接丢掉。前方一致：「YouTube」也丢「YouTube on MSN」（后面接着 ASCII 英数字的不算：「note」不丢「Notebookcheck」，丢「note株式会社」）
#   exclude_hosts 可选，这些网域（和下级网域）的条目直接丢掉：看还原后的原文链接・链接・Google 新闻给的媒体网站。众筹这种「不是新闻」的网站。
#                写成 {host: 网域, title: 正则} = 这个网域里标题像这个正则的才丢（攻略 wiki 也出新闻：只丢攻略页）
#   dedupe_others 可选，true = 别的关注项已经收过的同一件事（标题相近），这一项不再重复收
#   hot_only     可选，true = 只要最火的事：按多少家媒体在报同一件事排序，同一件事合成一条，
#                头条以外只留至少 4 家在报的；没那么多事就少写（不用 AI 编排时生效）
#   notes        可选，给 AI 的背景说明
#
# 简报外观（都可选）：
#   cover        封面图地址；不填会自动找（AniList / TMDB / Steam 封面，或 site 的预览图）
#   site         官网地址，用来找封面
#   theme        板块配色，不填就从封面自动取色。字段：
#                bg/fg/accent（主面底色/文字/强调）、alt_bg/alt_fg/alt_accent（副面），
#                split: true 标题条做成两色对角分割，font: serif | sans
#
# 按类型的专用字段：
#   game   steam_appid   Steam 商店网址里的数字，用来抓官方公告和当前价格
#   anime  anilist_id    anilist.co 网址里的数字；不填就按 keywords 的第一个词搜索。
#                        填第一季也行，会自动追到最新一季
#          anilist_type  ANIME（默认）或 MANGA
#   show   tmdb          themoviedb.org 网址里的那一段，如 tv/1399 或 movie/693134
#                        需要在仓库 Secrets 里设置 TMDB_API_KEY（免费申请）
#
# 話題度（heat index，见 scripts/heat.py）用：
#   wiki         可选，维基百科词条，「语言:词条名」的列表，如 ["en:Chainsaw Man", "ja:チェンソーマン"]。
#                几种语言的浏览量加在一起，算进「一般の関心」和「勢い」。没有词条的（一类东西、太小众的）不写，
#                这一维就不算（不是算 0 分）。词条名写错了收集日志里会有「维基没有词条」

settings:
  lookback_days: 7              # 只看最近 N 天
  first_lookback_days: 42       # 新加的关注项第一次收集时往前看 N 天，补上加入前的报道（补抓的不发要紧通知）
  intel: [japan]                # 地域ごとの情報員（intel/*.yaml、scripts/intel.py）。ここにある地域だけ動く（[] で全部止まる）
  news_langs: [zh-TW, en-US]    # 默认的新闻语言区：zh-CN / zh-TW / en-US / ja-JP / ko-KR
                                # 中文新闻用 zh-TW（港台媒体）：zh-CN 搜回来八九成是大陆网站，常拦海外服务器、图片防盗链。
                                # 某一项确实要大陆新闻时，在它的 news_langs 里写上 zh-CN（同时也收 Bing 上的大陆网站）
  languages:                    # 読者の言語（scripts/lang.py）。いずれ読者ごとに ⚙ 設定ページで選ぶ
    primary: ja                 # 主言語：同じニュースが何語でも来ていたら、この言語の版だけを載せる。網页の UI もこの言語
    secondary: [en, zh, ko]     # 副言語：主言語の版がないニュースはこの順で拾う。ここにない言語の記事は載せない
  timezone: Asia/Shanghai       # 「每天一期」的日期分界（AI 编辑的定时任务按北京时间判断「今天」，要改得一起改）
  display_timezone: Asia/Tokyo  # 网页上显示的时间（更新时间・播出时间・管理页）。用户住在日本；以后多用户时按各自的时区
  steam_country: cn             # Steam 价格地区
  max_entries_per_item: 30      # 每个关注项每期最多收集几条媒体报道
  max_reddit_per_item: 10       # 每个关注项每期最多收集几条 Reddit 帖子
  exclude_sources: [YouTube, 胡润百富, Unisba Media]   # 所有关注项都丢掉这些来源。胡润百富（hurun.net）2026-10 被黑，批量出色情 / 盗版「在线看」垃圾页。Unisba Media（media.unisba.ac.id）2026-10 被黑：标题 = 随便一条新闻 + 作品名 + 10 位随机码，页面 404
  # 所有关注项都丢掉这些网域。写网域 = 整个网域（众筹：出典名会变「ReadyFor(クラウドファンディング)」，按网域丢；猫用品・网球都有）。
  # {host, title} = 这个网域里标题像 title（正则）的才丢：攻略 wiki 的网站也出编辑部的新闻（GameWith 的新作发表・试玩评测、AI 编辑用过），
  # 只丢攻略页的标题形（「【あつ森】…【あつまれどうぶつの森】」「【ゼンゼロ】…の評価」）。收集时链接是 Google 的跳转、看不到路径，所以按标题分。
  # 电竞的直播页（escorenews 的「match stream, live broadcast」）不按网域丢：dota2 的 exclude「match stream」丢，escorenews 的新闻留着
  exclude_hosts:
    - readyfor.jp
    - camp-fire.jp
    - {host: gamewith.jp, title: &wiki_page '^\s*【[^】]+】(?:.*【[^】]+】(?:\s*[-|｜].{0,30})?\s*$|.*(?:評価|ステータス|攻略|一覧|やり方|方法|引くべき|ランキング|シミュレーター|おすすめ|入手|編成|条件))'}
    - {host: game8.jp, title: *wiki_page}
    - {host: altema.jp, title: *wiki_page}
  summarize: false              # true = 用 Claude API 编排报道（需要 ANTHROPIC_API_KEY，按量付费）
                                # false = 不用 AI，按 priority_keywords 排序、用原标题（完全免费）
  model: claude-haiku-5-5       # 归纳用的模型
  discord_mention: "263923518780080128"   # 要紧通知时 @ 这个 Discord 用户（填用户 ID，不是密码）
  # 「我会喜欢？」的 👍 / 👎：投票存进 Supabase（Postgres）。按 README「投票数据库」一节设置，两项都填了网页上才出现按钮。
  # 这里只放公开的 publishable key（网页本来就要用它，只能新增投票）；读投票用的 secret key 放仓库 Secret SUPABASE_SERVICE_KEY
  supabase_url: "https://bzokpnbcjscbcehdxtjq.supabase.co"           # 形如 https://xxxx.supabase.co
  supabase_key: "sb_publishable_EJunmcNeSQJOm2bnzc4JWA_u48iV4NC"           # publishable key（sb_publishable_ 开头）或旧版 anon key
  # 小分類の分け方（板块ごと）は sections.yaml。目次の札・版面の並びにどれを使うかは ⚙ 設定ページで選ぶ（Supabase の nav_schemes 表）

