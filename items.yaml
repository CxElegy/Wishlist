    news_langs: [ja-JP, zh-TW, en-US]
    max_entries: 30
    max_stories: 6
    priority: >-
      养两只猫的人会觉得「有意思 / 用得上」的消息：
      ① 特别新颖的新品（世界首款、新思路的智能设备、猫粮零食、日用品；普通新口味、换色款不要）；
      ② 好价和大促（日本 Amazon / 楽天 优先，其次双十一、黑五）；
      ③ 健康提醒和科普（季节性注意、传染病、新药新疗法，兽医讲解的养猫健康知识）；
      ④ 东京的猫咪活动和展会，其它地区只报大型的；
      ⑤ 好看的猫主题周边（别的板块已经报过的不重复）；
      召回只报特别重大的（日本有卖的大品牌、范围大、出了死伤）
    priority_keywords: [
      世界初, 業界初, 新発想, 全球首款, 首款, 黑科技, world's first, first-ever,
      セール, 割引, 半額, 特価, 大促, 折扣, 好价, 双十一, deal, sale, Black Friday, ブラックフライデー,
      獣医, 感染症, 注意, 新薬, 承認, 兽医, 提醒, FIP, SFTS,
      東京, 都内, 渋谷, 新宿, 池袋, 銀座, ビッグサイト, 幕張, イベント, 展示, 開催, 展会, 博览会,
      自主回収, 召回
    ]
    urgent_patterns:
      # 只有日本的猫粮 / 用品召回当天通知（日本能买到，才真正相关）
      - '(キャットフード|猫用|ペットフード|ちゅ～る).{0,30}(自主回収|回収|リコール)'
    notes: >-
      读者家里养了两只猫。要的是：特别新颖的新品（智能设备、猫粮零食、日用品都可以，
      但要真有新意：世界首款、新思路、解决老问题的新办法；普通新口味、换色、换包装、软文带货不要）、
      好价和大促（写清在哪买、原价和折后价、截止时间）、对养猫有用的健康提醒和科普（季节性注意、传染病、新药；兽医或靠谱媒体讲解的病因、症状、预防，blurb 里点出一两条实用要点）、东京的猫咪活动和展会（其它地区只报大型的）、设计好看的猫主题周边（文具、杂货、联名都可以）。
      召回和安全事件只报特别重大的：日本能买到的大品牌、范围大、或出了死伤；国外的小规模召回、猫粮检测研究不报。
      不报：测评横评和排行榜、猫咪趣闻、萌宠视频、领养走失、救助求助、个人闘病记录。
      别的板块已经报过的事（如星巴克马克杯板块的黑猫杯）这里不再重复，同一期里在别的板块出现过的也不要再写。同一款产品的发售消息和之后的报道合成一条，refs 都列上。
    theme:   # 自选：奶油米色 + 猫爪粉 + 橘猫橙，对角分割，无衬线
      bg: "#FBF4EA"
      fg: "#3A2C24"
      accent: "#E8875B"
      alt_bg: "#3A2C24"
      alt_fg: "#FBF4EA"
      alt_accent: "#F3B6B0"
      split: true
      font: sans

