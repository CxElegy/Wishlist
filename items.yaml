    subtitle: 日本雪场 · 雪板装备 · 2026-27
    size: L
    type: category
    section: 运动
    keywords: [
      "日本 滑雪 2026", "スキー場 オープン 2026-27", "スキー場 リフト券 2026-27", "Japan ski season 2026-27",
      "26-27 スノーボード 新作", "26-27 snowboard", "2027 snowboard new"
    ]
    # 只收和雪场、雪板装备直接相关的：单独的「スキー」「ski」会混进选手、比赛、海外雪场
    match: [
      スキー場, ゲレンデ, スノーリゾート, リフト券, スノーボード, スノボ, ビンディング,
      滑雪场, 雪场, 雪板, 单板, 固定器, 雪靴, 二世古, 白马,
      Niseko, ニセコ, Hakuba, 白馬, Japan ski, ski Japan, Japow, マウンテンリゾート,
      2027 snowboard, snowboard review, snowboard binding, Ogasaka, オガサカ,
      # 季号・泛词・常用词は雪の语と一緒のときだけ（CLAUDE.md「匹配词的写法」）：
      # 「26/27」はサッカー（鹿島アントラーズ 2026/27 J1）・音楽祭（COUNTDOWN JAPAN 26/27）にも当たる。ski は単語だけ（skipper・skincare に当たらない）
      # 英語の語の境は \b ではなく (?<![A-Za-z]) / (?![A-Za-z])：Python の \b はかな・漢字も単語の字にするので「CAPiTAの」「skiシーズン」に当たらない
      're:(?is)(?=.*(?<!\d)(?:20)?26/27(?!\d))(?=.*(snowboard|(?<![A-Za-z])ski(?:s|ing|er|ers)?(?![A-Za-z])|スノーボード|スノボ|スキー|ビンディング|ゲレンデ))',
      # 「早割」「シーズン券」はお歳暮・服（マウンテンパーカー）・化粧品（パウダー・雪肌精・リフトアップ）・キャンプ用品・雪まつりの早割にも当たる：
      # 相手の語は単独のマウンテン・スノー・パウダー・雪・リフトにしない（雪は 雪山・雪質… の具体的な語、リフトは リフト券・リフト運行…）
      're:(?is)(?=.*(早割|シーズン券))(?=.*(スキー|ゲレンデ|リフト(?:券|料金|運行|営業|乗り場|1日|一日)|雪山|雪質|積雪|降雪|雪上|新雪|(?<![A-Za-z])ski(?:s|ing|er|ers)?(?![A-Za-z])|スノーリゾート|スノーボード|スノボ|マウンテンリゾート|ネコマ))',
      're:(?<![A-Za-z])CAPiTA(?![A-Za-z])',   # ブランドの書き方そのまま（区別する）：「Vernal Capital」「per capita」に当たらない
      're:(?is)(?=.*(?<![A-Za-z])Capita(?![A-Za-z]))(?=.*(snowboard|スノー|スノボ|(?<![A-Za-z])DOA(?![A-Za-z])|Mercury|Ultrafear|Defenders of Awesome|(?<![A-Za-z])review(?![A-Za-z])))',   # 「Capita」は英国の Capita plc にも：雪板の語と一緒のときだけ
      # Burton は人名（Tim Burton）・地名にも多い：雪・板の語か Burton のモデル名と一緒のときだけ（r/snowboarding の比べの帖子は要約に「board」しかない）
      're:(?is)(?=.*(?<![A-Za-z])Burton(?![A-Za-z]))(?=.*(snow|スノー|スノボ|(?<![A-Za-z])ski(?:s|ing|er|ers)?(?![A-Za-z])|スキー|雪山|雪上|ゲレンデ|binding|ビンディング|(?<![A-Za-z])boards?(?![A-Za-z])|バートン|Step On|(?<![A-Za-z])(?:Custom|Process|Ripcord|Yeasayer|Feelgood|Blossom|Kilroy|Cartel|Malavita)(?![A-Za-z])))'
    ]
    exclude: [
      ジャンプ, W杯, World Cup, 五輪, Olympic, 選手, 選抜, Team, X Games, World Tour,
      競馬, JET SKI, 知事選, 求人, 中古, 画像・写真,
      COUNTDOWN, CDJ, 平野歩夢, ハンバーガー, 漢堡   # 「26/27」也是音乐节 COUNTDOWN JAPAN 26/27；Niseko 也是店名
    ]
    news_langs: [zh-TW, ja-JP, en-US]
    max_entries: 40
    subreddits: [JapanSnow]   # r/snowboarding 太杂（全球闲聊），不收
    priority: >-
      日本雪场的开放日期、新缆车 / 新吊椅、缆车票价和早鸟票、今冬雪况；
      26-27 新款雪板、固定器、雪靴（Burton、CAPiTA、UNION、GRAY、Yonex、Ogasaka 等）的发布、日本发售和到货
    priority_keywords: [
      オープン, 営業開始, 開業, 开放, 开业, opening, open,
      リフト券, シーズン券, 早割, 早鸟, 票价, lift ticket, season pass,
      新ゴンドラ, 新リフト, 缆车, gondola, 降雪, 積雪, 初滑り, 雪况, snowfall,
      新作, 新モデル, 新款, 发布, 発表, 発売, 予約, 入荷, new model, release
    ]
    urgent_patterns:
      # 雪场开放日确定 / 已开放
      - '(オープン|営業開始|開業|开放|开业|open\w*).{0,10}(決定|決まる|確定|确定|公布|発表|開始|开始|announce|confirm)'
      - '(今季|今シーズン|初滑り|今天|本日).{0,6}(オープン|営業開始|开放|open)'
      # 早鸟票 / 季票开卖
      - '(早割|早鸟|早鳥|シーズン券|季票|season pass|early.?bird).{0,10}(発売|開始|开始|开卖|販売|on sale|start)'
    notes: >-
      一类关注项：日本 2026-27 雪季 + 26-27 雪板装备。已知背景（2026/10）：
      二世古 / 富良野 / 留寿都 / 野泽温泉 预计 11/28 开放，白马约 12 月初；二世古 Village 新缆车第 1 段与栂池 6 人座吊椅 T3 均 12 月启用；
      缆车票普遍涨 5–20%；气象厅预报日本海一侧降雪偏少，强厄尔尼诺。
      装备方面 Burton Family Tree 新款、CAPiTA Sidewinder、UNION NEO 固定器、K2 26/27 已发布，GRAY 等多款 12 月到货。
    theme:   # 自选：雪白 + 深夜蓝 + 雪场缆车的朱红，对角分割，无衬线
      bg: "#F4F8FB"
      fg: "#14233A"
      accent: "#D9412B"
      alt_bg: "#14233A"
      alt_fg: "#F4F8FB"
      alt_accent: "#8EC5E8"
      split: true
      font: sans

