name: CI 检查

# 每个合进 main 的 PR 都自动跑：测试 + 网页能不能生成。没通过的 PR 先别合并（让 Claude 修好再推）。

on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: 测试 · 网页能生成
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # 架构图检查要和 main 比
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 关注清单 / 愿望清单格式正确
        run: python -c "import sys; sys.path.insert(0, 'scripts'); import digest; digest.load_config(); print(len(digest.load_wishlist()), '件愿望')"
      - name: 改了逻辑就要改架构图
        run: python scripts/check_arch.py
      - name: 测试
        run: python -m unittest discover -s tests
      - name: 网页能生成
        run: python scripts/digest.py render && test -s docs/index.html
