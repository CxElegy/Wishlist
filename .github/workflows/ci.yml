name: CI 检查

# 每个合进 main 的 PR 都自动跑：测试 + 网页能不能生成。没通过的 PR 先别合并（让 Claude 修好再推）。

on:
  pull_request:
    branches: [main]
    # edited：PR 说明里补上「架构图：不用改（理由）」后也重跑，不然这次检查一直是红的
    types: [opened, synchronize, reopened, edited]

jobs:
  check:
    name: 测试 · 网页能生成
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # 架构图检查要和 main 比
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 关注清单 / 愿望清单格式正确
        run: python -c "import sys; sys.path.insert(0, 'scripts'); import digest; digest.load_config(); print(len(digest.load_wishlist()), '件愿望')"
      - name: 改了逻辑就要改架构图
        run: python scripts/check_arch.py
      # ブラウザの試験（壁の形・小元素の列など）が playwright 無しで skip され、手元は赤・CI は緑になっていた（2026-11-04 ③）
      - name: 浏览器（chromium）
        run: pip install playwright && playwright install --with-deps chromium
      - name: 测试
        run: |
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/unittest.log | tail -n 40
          test ${PIPESTATUS[0]} -eq 0
          echo "skip した試験: $(grep -c ' skipped ' /tmp/unittest.log)"
      - name: 网页能生成
        run: python scripts/digest.py render && test -s docs/home/index.html
      # 2026-11-05：#919 で render の JS の文法の誤りが本番の全ページの JS を約 15 分止めた。生成した全ページの埋め込み JS を確かめ、2 ページを開いて例外 0 を見る
      - name: 网页的 JS（文法・开页面无例外）
        run: |
          python harness/js_check.py docs/home docs/index.html
          python harness/page_errors.py home/index.html index.html
