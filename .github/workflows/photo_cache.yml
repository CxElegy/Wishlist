# 点検用の写真の写しを埋める「1 日 1 回の決まった 1 つの仕事」（docs/rules/free-tier.md）。
# 点検・係は写しを読むだけ。本番の Supabase から落とすのはここだけ（1 回 100 MB まで・写しに無いものだけ）。
name: photo cache
on:
  schedule:
    - cron: "23 19 * * *"    # 日本時間 4:23
  workflow_run:   # 新しい写真は render のあとに html へ載る → その回で写しに足し、Pages に出し直す（毎日 1 回だと最大 1 日 /p/ が 404 になった。2026-11-03）
    workflows: ["网页立即更新", "Pages 公開"]   # 編排・后台作業の push（render を通らない）で増えた写真も次の回で拾う。変わらなければ pages を起こさず止まる（輪にならない）
    types: [completed]
  workflow_dispatch:
    inputs:
      max_mb:
        description: "今回落とす上限 MB（初回に全部埋めるときだけ 400。ふだんは 100）"
        default: "100"
concurrency:
  group: photo-cache
  cancel-in-progress: false
permissions:
  contents: write   # state/pages_size.json（公開物の大きさ。1 日 1 回）を書く
  actions: write   # 写しが増えたら pages.yml を起こす
jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      WL_PHOTO_CACHE: ${{ github.workspace }}/.photo_cache
      WL_FILL_MAX_MB: ${{ inputs.max_mb }}
      WL_FILL_MAX_MIN: ${{ inputs.max_mb && 40 || 12 }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}   # boards.config の小元素の名前を読むだけ（非公開の版面は anon に見えない）
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: .photo_cache
          key: wl-photo-cache-${{ github.run_id }}
          restore-keys: wl-photo-cache-
      - id: fill
        run: python harness/photo_cache_fill.py
      - name: boards の小元素 ⊆ 写し・storage 網址 0 を数える（足りなければ警告。写しの追加は Pages 公開のあとに manifest へ出る）
        if: always()
        run: python harness/pages_health.py --emblems || echo "::warning::boards の小元素が Pages の写しに足りない、または boards に storage の網址がある（上の行）"
      - name: 公開物の大きさを測る（1 GB の 70% 超で赤。測れず＝まだ bytes が無いのは失敗にしない。記録は 1 日 1 回）
        if: always()
        run: |
          rc=0
          python harness/pages_health.py --size --set || rc=$?
          if [ -n "$(git status --porcelain state/pages_size.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/pages_size.json
            git commit -q -m "公開物の大きさを記録"
            python scripts/push_main.py --soft   # 前は rebase の途中で止まったまま exit 0
          fi
          [ "$rc" -ne 1 ]
      - name: 古い cache を各名前で最新 1 つだけ残して消す（run_id ごとに新しいキーで保存する形は 10 GB の枠を食い切り「Unable to reserve cache」になった。2026-11-04）。保存の有無に関わらず毎回。他の workflow の run_id キー（ask-state・wishlist-http・wd-facts）もここで一括（枠は共有）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for p in wl-photo-cache- ask-state- wishlist-http- wd-facts-; do
            if ! ids=$(gh cache list --key "$p" --sort created_at --order desc --limit 100 --json id --jq '.[1:][].id'); then
              echo "::warning::gh cache list が失敗（$p。権限 actions: write が要る）。古い cache が消えず枠が埋まるかもしれない"
              continue
            fi
            for id in $ids; do gh cache delete "$id" || echo "::warning::gh cache delete $id が失敗（$p）"; done
          done
          {
            echo "### cache の残り（消したあと）"
            gh cache list --limit 100 --json key,sizeInBytes --jq '"- 合計 \(map(.sizeInBytes) | add // 0 | . / 1048576 | floor) MB（\(length) 件）", (.[:10][] | "- \(.key)：\(.sizeInBytes / 1048576 | floor) MB")' || echo "- 一覧が読めず"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@v4
        if: always() && steps.fill.outputs.changed == 'true'   # 変わらない回は保存しない（200 MB の写しで他の cache を押し出さない）
        with:
          path: .photo_cache
          key: wl-photo-cache-${{ github.run_id }}
      # 2026-11-03：save が「Unable to reserve cache」と警告だけで終わり（緑のまま）、80 枚が Pages に載らなかった。入ったかを探し、無ければ別の名前でもう 1 回、それでも無ければ赤にする
      - id: chk
        if: always() && steps.fill.outputs.changed == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .photo_cache
          key: wl-photo-cache-${{ github.run_id }}
          lookup-only: true
      - uses: actions/cache/save@v4
        if: always() && steps.fill.outputs.changed == 'true' && steps.chk.outputs.cache-hit != 'true'
        with:
          path: .photo_cache
          key: wl-photo-cache-${{ github.run_id }}-retry
      - id: chk2
        if: always() && steps.fill.outputs.changed == 'true' && steps.chk.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .photo_cache
          key: wl-photo-cache-${{ github.run_id }}-retry
          lookup-only: true
      # 2026-11-04 の実測：掃除のあとでも workflow_run の回だけ「cache write denied: token has no writable scopes」で 2 回とも保存が拒まれた（run 127）。同じ main の workflow_dispatch の回は 1 回目で保存できた（run 128）＝枠でなく、その回の書き込みの権限。
      # → workflow_run の回で入らなかったら、赤にせず workflow_dispatch で自分を起こし直す（書ける回で埋め直す）。dispatch の回が入らなければ赤（輪にならない）
      - name: 写しが保存できたか（どちらの名前にも無ければ、workflow_run の回は dispatch で起こし直す・dispatch の回は赤）
        if: always() && steps.fill.outputs.changed == 'true' && steps.chk.outputs.cache-hit != 'true' && steps.chk2.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::写しが保存できなかった（dispatch の回でも 2 回とも）。Pages に新しい写真が載らない"
            exit 1
          fi
          echo "::warning::${{ github.event_name }} の回では写しを保存できなかった。workflow_dispatch で起こし直す（書ける回で埋め直す）"
          gh workflow run photo_cache.yml --ref main
      - name: 写しが変わったら Pages を出し直す（保存できた回だけ）
        if: steps.fill.outputs.changed == 'true' && (steps.chk.outputs.cache-hit == 'true' || steps.chk2.outputs.cache-hit == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
