# 点検用の写真の写しを埋める「1 日 1 回の決まった 1 つの仕事」（docs/rules/free-tier.md）。
# 点検・係は写しを読むだけ。本番の Supabase から落とすのはここだけ（1 回 100 MB まで・写しに無いものだけ）。
name: photo cache
on:
  schedule:
    - cron: "23 19 * * *"    # 日本時間 4:23
  workflow_run:   # 新しい写真は render のあとに html へ載る → その回で写しに足し、Pages に出し直す（毎日 1 回だと最大 1 日 /p/ が 404 になった。2026-11-03）
    workflows: ["网页立即更新"]
    types: [completed]
  workflow_dispatch:
    inputs:
      max_mb:
        description: "今回落とす上限 MB（初回に全部埋めるときだけ 400。ふだんは 100）"
        default: "100"
concurrency:
  group: photo-cache
  cancel-in-progress: false
permissions:
  contents: read
  actions: write   # 写しが増えたら pages.yml を起こす
jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      WL_PHOTO_CACHE: ${{ github.workspace }}/.photo_cache
      WL_FILL_MAX_MB: ${{ inputs.max_mb }}
      WL_FILL_MAX_MIN: ${{ inputs.max_mb && 40 || 12 }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}   # boards.config の小元素の名前を読むだけ（非公開の版面は anon に見えない）
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: .photo_cache
          key: wl-photo-cache-${{ github.run_id }}
          restore-keys: wl-photo-cache-
      - id: fill
        run: python harness/photo_cache_fill.py
      - name: boards の小元素 ⊆ 写し・storage 網址 0 を数える（足りなければ警告。写しの追加は Pages 公開のあとに manifest へ出る）
        if: always()
        run: python harness/pages_health.py --emblems || echo "::warning::boards の小元素が Pages の写しに足りない、または boards に storage の網址がある（上の行）"
      - uses: actions/cache/save@v4
        if: always() && steps.fill.outputs.changed == 'true'   # 変わらない回は保存しない（200 MB の写しで他の cache を押し出さない）
        with:
          path: .photo_cache
          key: wl-photo-cache-${{ github.run_id }}
      - name: 写しが変わったら Pages を出し直す
        if: steps.fill.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
