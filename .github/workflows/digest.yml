name: 关注清单简报

on:
  schedule:
    - cron: "17 0 * * 1"   # 每周一 00:17 UTC（北京时间 08:17）
  workflow_dispatch:        # 也可以在 Actions 页面手动运行

permissions:
  contents: write
  issues: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 抓取并整理
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/digest.py

      - name: 提交报告
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports state
          git diff --cached --quiet || git commit -m "简报 $(date -u +%F)"
          git push

      - name: 发布为 Issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          enabled=$(python -c "import yaml; print((yaml.safe_load(open('items.yaml')).get('settings') or {}).get('create_issue', True))")
          if [ "$enabled" = "True" ]; then
            head -c 60000 reports/LATEST.md > issue.md   # Issue 正文上限 65536 字符
            gh issue create --title "关注清单简报 $(date -u +%F)" --body-file issue.md
          fi
