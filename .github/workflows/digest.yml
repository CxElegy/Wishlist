name: 关注清单通信

# 每 2 小时：收集 → 更新简报网页（GitHub Pages）→ 有要紧消息立刻发 Discord
# 每周一早上：发 Discord 周报（过去 7 天的要点 + 网页链接）
# 改了关注清单或代码并推送时：立刻跑一次（新增关注项、新功能马上通知 Discord，网页马上按新版式更新）

on:
  schedule:
    - cron: "17 */2 * * *"   # 每 2 小时（UTC 的偶数点 17 分）
    - cron: "47 0 * * 1"     # 每周一 00:47 UTC = 北京时间 08:47，发周报
  push:
    branches: [claude/sharp-gauss-osunmb]   # 只有主分支（网页所在分支）；PR 合并进来时才触发，避免未合并的分支先发通知
    paths: ["items.yaml", "scripts/**", ".github/**", "EDITING.md", ".claude/**", "requirements.txt", "README.md"]
  workflow_dispatch:
    inputs:
      weekly:
        description: "顺便发一次周报（测试用）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      IS_WEEKLY: ${{ github.event.schedule == '47 0 * * 1' || inputs.weekly == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 功能更新通知要读提交记录

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 收集并更新简报
        if: env.IS_WEEKLY != 'true' || github.event_name == 'workflow_dispatch'
        run: python scripts/digest.py

      - name: 功能更新 → Discord
        run: python scripts/digest.py notify-changes

      - name: 新增关注项 → Discord
        run: python scripts/digest.py notify-new-items

      - name: 要紧消息 → Discord
        if: env.IS_WEEKLY != 'true' || github.event_name == 'workflow_dispatch'
        run: python scripts/digest.py notify-urgent

      - name: 周报 → Discord
        if: env.IS_WEEKLY == 'true'
        run: |
          python scripts/digest.py notify-weekly
          # 心跳：每周至少提交一次。公开仓库连续 60 天没有活动，GitHub 会悄悄停用定时任务
          TZ=Asia/Shanghai date +'%F %H:%M 周报已发送' > state/heartbeat.txt

      - name: 提交（docs/ 由 GitHub Pages 发布）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inbox reports state docs
          git diff --cached --quiet || git commit -m "更新 $(TZ=Asia/Shanghai date +'%F %H:%M')"
          # 运行期间别处也推送了（合并 PR、改代码、AI 编辑）：先合并；生成文件冲突时以这次的新数据为准，
          # 再用合并后的代码重新生成网页。最多试 3 次
          for i in 1 2 3; do
            if git pull --rebase -X theirs -q; then
              python scripts/digest.py render
              git add docs
              git diff --cached --quiet || git commit -q -m "重新生成网页"
              git push && exit 0
            else
              git rebase --abort || true
            fi
            sleep $((i * 5))
          done
          exit 1
