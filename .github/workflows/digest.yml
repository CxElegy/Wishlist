name: 关注清单通信

# 每 2 小时：收集 → 更新简报网页（GitHub Pages）→ 有要紧消息立刻发 Discord
# 每周一早上：发 Discord 周报（过去 7 天的要点 + 网页链接）
# 改了关注清单或代码并推送时：立刻跑一次（新增关注项、新功能马上通知 Discord，网页马上按新版式更新）

on:
  schedule:
    - cron: "17 */2 * * *"   # 每 2 小时（UTC 的偶数点 17 分）
    - cron: "47 0 * * 1"     # 每周一 00:47 UTC = 北京时间 08:47，发周报
  push:
    branches: [main]   # 只有 main（网页所在分支）；PR 合并进来时才触发，避免未合并的分支先发通知
    paths: ["items.yaml", "wishlist.yaml", "docs/home/wishlist/**", "scripts/**", ".github/**", "EDITING.md", ".claude/**", "requirements.txt", "README.md"]
  workflow_dispatch:
    inputs:
      weekly:
        description: "顺便发一次周报（测试用）"
        type: boolean
        default: false
      repair_images:
        description: "重新给已出刊的报道找配图（Bing 缩略图・作品封面・坏图换成原文的图）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40   # 収集は 18 分で締め切り（digest.COLLECT_DEADLINE_MIN）、残りは出刊・通知・push の分
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}   # 读「我会喜欢？」的投票
      WIKIMEDIA_TOKEN: ${{ secrets.WIKIMEDIA_TOKEN }}   # Wikimedia の上限を IP（共有）ではなくアカウントごとに（scripts/wikihttp.py）
      IS_WEEKLY: ${{ github.event.schedule == '47 0 * * 1' || inputs.weekly == true }}
      WL_RENDER_SOFT: "1"   # 網页の生成に失敗しても、集めたデータは push する（digest.write_page）
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}   # 触发时的提交ではなく、いまの main の先頭（排队等待期间 AI 编辑推送的 edit.json 也要拿到）
          fetch-depth: 0   # 功能更新通知要读提交记录

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 拒まれた記事の頁だけ本物のブラウザで開き直す（scripts/images.py の _browser_html、1 回 10 頁まで）。
      # 入れられなかったら SCRAPLING_BROWSER を立てず、ふつうの取り直し（Fetcher）だけで続ける
      - name: 本物のブラウザ（scrapling・拒まれた頁だけ）
        continue-on-error: true
        run: scrapling install && echo "SCRAPLING_BROWSER=1" >> "$GITHUB_ENV"

      - name: 收集并更新简报
        if: env.IS_WEEKLY != 'true' || github.event_name == 'workflow_dispatch'
        run: python scripts/digest.py

      - name: 重新找配图（手动，repair_images）
        if: inputs.repair_images == true
        run: python scripts/digest.py repair-images

      - name: 功能更新 → Discord
        run: python scripts/digest.py notify-changes

      - name: 记下这次新加的关注项（发通知前，发完就记进 known_items 了）
        run: echo "NEW_ITEMS=$(python scripts/digest.py new-items)" >> "$GITHUB_ENV"

      - name: 愿望清单 → Discord
        run: python scripts/digest.py notify-wishlist

      - name: 新增关注项 → Discord
        run: python scripts/digest.py notify-new-items

      - name: 要紧消息 → Discord
        if: env.IS_WEEKLY != 'true' || github.event_name == 'workflow_dispatch'
        run: python scripts/digest.py notify-urgent

      - name: 周报 → Discord
        if: env.IS_WEEKLY == 'true'
        run: |
          # 心跳：每周至少提交一次。公开仓库连续 60 天没有活动，GitHub 会悄悄停用定时任务。送れなかったら「发送失败」と書く（嘘の「已发送」を書かない）
          if python scripts/digest.py notify-weekly; then msg="周报已发送"; else msg="周报发送失败（Discord 拒绝或网络错误，见日志）"; fi
          TZ=Asia/Shanghai date +"%F %H:%M $msg" > state/heartbeat.txt

      - name: 提交（docs/ 由 GitHub Pages 发布）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inbox reports state docs wishlist.yaml items.yaml   # wishlist.yaml：新闻里点了「加入心愿单」的；items.yaml：设置页上新增的关注项
          git diff --cached --quiet || git commit -m "更新 $(TZ=Asia/Shanghai date +'%F %H:%M')"
          # 运行期间别处也推送了（合并 PR、改代码、AI 编辑）：先合并；生成文件冲突时以这次的新数据为准，
          # 再用合并后的代码重新生成网页。最多试 3 次
          for i in 1 2 3; do
            if git pull --rebase -X theirs -q; then
              python scripts/digest.py render
              git add docs
              git diff --cached --quiet || git commit -q -m "重新生成网页"
              git push && exit 0
            else
              git rebase --abort || true
            fi
            sleep $((i * 5))
          done
          exit 1

      # 新加的关注项已经收集到消息、但当天还没被 AI 编辑过：经ゲート（gate.py fire）立刻叫 AI 编辑，不用等 9:00 / 18:00 的回。
      # GATE_NOW=edit：间隔・定时不看，但管理页的一時停止（edit_control）・仓库变量 GATE_FIRE=0 照样守，叫了就记进 state/gate.json・state/log/gate.json。
      # 必须在推送之后，Routine 拉仓库时才看得到新条目。需要仓库 Secret ROUTINE_FIRE_TOKEN；没设置就跳过，照旧等定时编排
      - name: 新关注项 → 立刻 AI 编辑（ゲート経由）
        if: env.NEW_ITEMS != ''
        env:
          ROUTINE_TOKEN_EDIT: ${{ secrets.ROUTINE_FIRE_TOKEN }}
          GATE_FIRE: ${{ vars.GATE_FIRE || 'edit' }}
          GATE_NOW: edit
        run: |
          if [ -z "$ROUTINE_TOKEN_EDIT" ]; then echo "没设置 ROUTINE_FIRE_TOKEN，等定时编排"; exit 0; fi
          git pull -q --rebase || true
          names=$(python scripts/digest.py unedited --only "$NEW_ITEMS")
          if [ -z "$names" ]; then echo "新关注项还没有消息或已编排过，不用叫 AI 编辑"; exit 0; fi
          echo "新关注项：$names"
          python scripts/gate.py check > /dev/null
          python scripts/gate.py fire > /tmp/fire.txt || { echo "::warning::叫 AI 编辑失败，等定时编排"; exit 0; }
          cat /tmp/fire.txt
          grep -q "^edit *Claude を起こした" /tmp/fire.txt || exit 0
          # 叫起的记录（下次ゲート判断「編集中」「停滞」用）也 push 上去
          git add state/gate.json state/log/gate.json
          git diff --cached --quiet || git commit -q -m "ゲート：新関注項で AI 編集を起こした"
          git stash -q --include-untracked || true   # ほかに変わったもの（判断だけの記録）は捨てる：pull --rebase の邪魔になる
          for i in 1 2 3; do
            if git pull --rebase -X theirs -q; then git push && exit 0; else git rebase --abort || true; fi
            sleep $((i * 5))
          done
          echo "::warning::ゲートの記録を push できなかった"
