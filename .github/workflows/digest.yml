name: 关注清单 · 收集

# 目前只跑 ingest：抓取 → 过滤 → 去重，产出 inbox/日期.json 后停止。
# publish（编排、出刊网页、Issue 提醒）是下一阶段，届时再接上。

on:
  schedule:
    - cron: "17 0 * * 1"   # 每周一 00:17 UTC（北京时间 08:17）
  workflow_dispatch:        # 也可以在 Actions 页面手动运行

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 收集（ingest）
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python scripts/digest.py ingest

      - name: 提交 inbox
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inbox state
          git diff --cached --quiet || git commit -m "收集 $(date -u +%F)"
          git push
