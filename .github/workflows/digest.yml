name: 关注清单通信

# 每 2 小时：收集 → 更新简报网页（GitHub Pages）→ 有要紧消息立刻发 Discord
# 每周一早上：发 Discord 周报（过去 7 天的要点 + 网页链接）
# 改了关注清单或代码并推送时：立刻跑一次（新增关注项、新功能马上通知 Discord，网页马上按新版式更新）

on:
  schedule:
    - cron: "17 */2 * * *"   # 每 2 小时（UTC 的偶数点 17 分）
    - cron: "47 0 * * 1"     # 每周一 00:47 UTC = 北京时间 08:47，发周报
  push:
    branches: [main]   # 只有 main（网页所在分支）；PR 合并进来时才触发，避免未合并的分支先发通知
    paths: ["items.yaml", "wishlist.yaml", "docs/wishlist/**", "scripts/**", ".github/**", "EDITING.md", ".claude/**", "requirements.txt", "README.md"]
  workflow_dispatch:
    inputs:
      weekly:
        description: "顺便发一次周报（测试用）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}   # 读「我会喜欢？」的投票
      IS_WEEKLY: ${{ github.event.schedule == '47 0 * * 1' || inputs.weekly == true }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # 功能更新通知要读提交记录

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 收集并更新简报
        if: env.IS_WEEKLY != 'true' || github.event_name == 'workflow_dispatch'
        run: python scripts/digest.py

      - name: 功能更新 → Discord
        run: python scripts/digest.py notify-changes

      - name: 记下这次新加的关注项（发通知前，发完就记进 known_items 了）
        run: echo "NEW_ITEMS=$(python scripts/digest.py new-items)" >> "$GITHUB_ENV"

      - name: 愿望清单 → Discord
        run: python scripts/digest.py notify-wishlist

      - name: 新增关注项 → Discord
        run: python scripts/digest.py notify-new-items

      - name: 要紧消息 → Discord
        if: env.IS_WEEKLY != 'true' || github.event_name == 'workflow_dispatch'
        run: python scripts/digest.py notify-urgent

      - name: 周报 → Discord
        if: env.IS_WEEKLY == 'true'
        run: |
          python scripts/digest.py notify-weekly
          # 心跳：每周至少提交一次。公开仓库连续 60 天没有活动，GitHub 会悄悄停用定时任务
          TZ=Asia/Shanghai date +'%F %H:%M 周报已发送' > state/heartbeat.txt

      - name: 提交（docs/ 由 GitHub Pages 发布）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inbox reports state docs wishlist.yaml items.yaml   # wishlist.yaml：新闻里点了「加入心愿单」的；items.yaml：设置页上新增的关注项
          git diff --cached --quiet || git commit -m "更新 $(TZ=Asia/Shanghai date +'%F %H:%M')"
          # 运行期间别处也推送了（合并 PR、改代码、AI 编辑）：先合并；生成文件冲突时以这次的新数据为准，
          # 再用合并后的代码重新生成网页。最多试 3 次
          for i in 1 2 3; do
            if git pull --rebase -X theirs -q; then
              python scripts/digest.py render
              git add docs
              git diff --cached --quiet || git commit -q -m "重新生成网页"
              git push && exit 0
            else
              git rebase --abort || true
            fi
            sleep $((i * 5))
          done
          exit 1

      # 新加的关注项已经收集到消息、但当天还没被 AI 编辑过：立刻叫 Claude 定时任务（Routine）编一次，
      # 不用等 12:43 / 23:43。必须在推送之后，Routine 拉仓库时才看得到新条目。
      # 需要仓库 Secret ROUTINE_FIRE_TOKEN（claude.ai/code/routines → AI 编辑 → 编辑 → 添加触发器 → API → 生成令牌）；
      # 没设置就跳过，照旧等定时编排
      - name: 新关注项 → 立刻 AI 编辑
        if: env.NEW_ITEMS != ''
        env:
          ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
          ROUTINE_ID: trig_01QyUjFidUCUR1sngyt8wdBt
        run: |
          if [ -z "$ROUTINE_FIRE_TOKEN" ]; then echo "没设置 ROUTINE_FIRE_TOKEN，等定时编排"; exit 0; fi
          git pull -q --rebase || true
          names=$(python scripts/digest.py unedited --only "$NEW_ITEMS")
          if [ -z "$names" ]; then echo "新关注项还没有消息或已编排过，不用叫 AI 编辑"; exit 0; fi
          body=$(python -c 'import json,sys; print(json.dumps({"text": "新加的关注项：" + sys.argv[1] + "。先按 TEMPLATES.md 给它们设计版面模版（和已有的相似就合并），再按 EDITING.md 整份重新编排今天的报道（今天的 edit.json 里还没有它们）。"}, ensure_ascii=False))' "$names")
          curl -fsS -X POST "https://api.anthropic.com/v1/claude_code/routines/$ROUTINE_ID/fire" \
            -H "Authorization: Bearer $ROUTINE_FIRE_TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "$body" || echo "::warning::叫 AI 编辑失败，等定时编排"
