name: 关注清单简报

on:
  schedule:
    - cron: "17 0 * * 1"   # 每周一 00:17 UTC（北京时间 08:17）
  workflow_dispatch:        # 也可以在 Actions 页面手动运行

permissions:
  contents: write
  issues: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 抓取、编辑、生成简报
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python scripts/digest.py

      - name: 提交（docs/ 由 GitHub Pages 发布）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports state docs
          git diff --cached --quiet || git commit -m "简报 $(date -u +%F)"
          git push

      - name: 开 Issue 提醒
        if: hashFiles('issue.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          enabled=$(python -c "import yaml; print((yaml.safe_load(open('items.yaml')).get('settings') or {}).get('create_issue', True))")
          if [ "$enabled" = "True" ]; then
            gh issue create --title "关注清单通信 $(date -u +%F)" --body-file issue.md
          fi
