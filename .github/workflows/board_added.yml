name: 版面が足されたとき

# お客さまが版面を足したら、その場で後ろの仕組みを回す（2026-11-11 店長：新規ユーザーが盤面を追加したときの KPI と改善）。
# 起こすのは DB の my_keywords_set（db/board_added.sql の private.kick_board_added。1 人 1 時間 6 回・全体 1 時間 120 回）と、
# 控えに library.yml（毎時の --users で新しい版面を作った回：起こし損ね・1 人 6 回を超えた分）。
# 時間は harness/board_kpi.py が測る。AI 編集は今までどおり gate.py（lib の版面）が起こす。
#
# 2026-11-19 店長「新しい版面を足したら小元素が出るまでの時間は 5 分未満を保つ」。job を 3 つに分けた：
#   board  ：ライブラリの follows・boards（library.py --users）。library.yml と同じ列（group library：follows を 2 か所から同時に書かない）。
#   feed   ：board のあと。記事集め（userfeed.py）→ 足した人のページだけ（user_pages.py --recent）。記事が先・ページが後
#            （足したばかりの版面は記事 5 本までページに記事を載せない：user_pages.held）。
#   emblem ：board を待たずに最初から 3 つ並べて走る（matrix shard 0〜2 = library_emblem.FRESH_SHARDS。group は shard ごと：
#            library・library-emblem の列には並ばない）。重い道具（rembg・scrapling）は同じ step の中で後ろで入れ、その間に
#            library_emblem.py --fresh が版面の行（＋follows）が DB に現れるのを 5 秒おきに待つ。1 回見て「無い」と決めない
#            （2026-11-19 run 1：board の job が行を書く前に --check-fresh が「0」を見て終わり、小元素は 31〜34 分後だった）。
#            現れたら各 shard が未試行の版面を 1 つずつ claim（library.claim_board）して速い道（1 枚目が通った段で書く・上限 90 秒・規則は fill_one のまま）、
#            書いたらすぐその版面を追う人のページだけ作り直す（user_pages.py --boards-file F --emblem-only：前の測った結果で 10 秒ほど）。
#            同じ run の board の job が終わったのを見たあとに読んでも新しい版面が無ければ終える（経路 A/B は ≈ 1 分。GitHub の API：actions: read）。
#            続き（名簿の残り）は library_emblem.yml の列へ。
# 5 分の割り当て（library_emblem.FRESH_BUDGET。tests が「合計 + 余り 60 秒 ≤ 300」を数える）：
#   起こす 20（dispatch → runner）・用意 80（checkout・python・pip・写し・模型 ≈ 40 ＋ 後ろで rembg 13・scrapling 26、board の job が行を書く ≈ 50 と重なる）・
#   1 枚目 90・書く 5・ページ 45 ＝ 240 秒（余り 60）。各段の秒は「速い道の時刻 版面 N：…」の行（起きてからの秒）。
# 経路 A/B（店長・ライブラリにある名前）：board の job の終わりを見て終わる。重い道具は後ろで入れかけのまま job ごと終わる。

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # 小元素の続き（library_emblem.yml）を起こす・同じ run の board の job が終わったかを読む（write は read を含む）

env:
  PYTHONUNBUFFERED: "1"   # ログの各段の時刻がためずに出る（2026-11-19 run 2：「boards PATCH」4 行が全部最後にまとめて出た）

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: library   # library.yml と同じ：follows を 2 か所から同時に書かない
      cancel-in-progress: false
    env:
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Wikidata の引いた結果（お客さまの分、倉庫に入れない）
        uses: actions/cache/restore@v4
        with:
          path: state/wd_facts.json
          key: wd-facts-${{ github.run_id }}
          restore-keys: wd-facts-
      - name: お客さまの選んだものを版面にする
        run: |
          python scripts/library.py --users
          git add state/log/library.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "ライブラリ：お客さまの版面（足されたとき） $(TZ=Asia/Tokyo date +'%F %H:%M')"
          python scripts/push_main.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state/wd_facts.json
          key: wd-facts-${{ github.run_id }}
      - id: wdchk
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: state/wd_facts.json
          key: wd-facts-${{ github.run_id }}
          lookup-only: true
      - name: Wikidata の結果の保存が拒まれたら警告（save は拒まれても緑のまま）
        if: always() && steps.wdchk.outputs.cache-hit != 'true'
        run: echo "::warning::Wikidata の cache が保存できなかった（書き込みが拒まれた？）。次の回は空から始まる"

  feed:
    needs: board
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: board-added-feed   # 記事集めは group library を持たない（次に足した人の board の job を 10 分待たせない）
      cancel-in-progress: false
    env:
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 足された版面の記事集め
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/userfeed.py
      - name: 足した人のページを作って置く（記事のあと。1 時間以内に足した人だけ）
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/user_pages.py --recent 3600

  emblem:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]   # library_emblem.FRESH_SHARDS：同じ 30 秒に 3 つ足されても 3 つとも 1 回目の割り当てに入る
    concurrency:
      group: board-added-emblem-${{ matrix.shard }}   # shard ごと（同じ版面は config.emblem_claim で二重に取らない）。library・library-emblem の列には並ばない
      cancel-in-progress: false
    env:
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      WL_PHOTO_CACHE: ${{ github.workspace }}/.photo_cache
      WIKIMEDIA_TOKEN: ${{ secrets.WIKIMEDIA_TOKEN }}
      GH_TOKEN: ${{ github.token }}   # 同じ run の board の job の様子・run の起きた時刻（library_emblem.board_job_done・run_started）
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4   # 写しを読むだけ（library_emblem.yml と同じ。storage から落とさない）
        with:
          path: .photo_cache
          key: wl-photo-cache-none
          restore-keys: wl-photo-cache-
      - name: 模型的缓存（library_emblem.yml と同じ）
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.rembg
            ~/.cache/wishlist-faces
          key: emblem-models-v1
      - name: 新しい版面の小元素（行を待つ間に重い道具を後ろで入れ、来たら 1 枚目まで・書いたらその人のページ）
        id: fill
        run: |
          T="$RUNNER_TEMP/fresh_tools"
          ( pip install -q "rembg[cpu]>=2.0.60,<3" > "$T.log" 2>&1 && echo rembg=ok >> "$T"
            scrapling install >> "$T.log" 2>&1 && echo scrapling=ok >> "$T"
            echo done=1 >> "$T" ) &
          python scripts/library_emblem.py --fresh --wait 300 --minutes 9 --shard ${{ matrix.shard }} --tools "$T" --pages-dir "$RUNNER_TEMP"
      - name: 続き（名簿の残り・時間で残した版面）を今までの列へ
        if: steps.fill.outputs.more == 'true'
        run: gh workflow run library_emblem.yml -f minutes=20
