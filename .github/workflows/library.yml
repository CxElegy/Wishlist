name: ライブラリへ写す

# 店長の items.yaml をライブラリ（Supabase の boards・follows、db/library.sql）へ写す（scripts/library.py --push）。
# 何度流しても同じ（key で上書き）。items.yaml を変えたとき・手で起こしたときに走る。
# 店長の版面もお客さまの版面も番号の決め方は 1 つ（library.find_wikidata）。手で compare を付けて起こすと、店長の版面を今の規則で引き直して今の番号と比べるだけ（書かない）。
# 週 1 回（月曜 3:41 UTC）と手で起こしたときは、先に番号のない版面の Wikidata を引き直す（--refresh）：
# 見つかれば items.yaml に書いて push し、boards の行を名前の印（n:…）から番号の印（wd:…）へ書き換える。
# 断られた（429 など）と「項目が 0 件」は分けて state/log/library.json に書く。
# 1 時間ごと（毎時 41 分）：お客さまの選んだもの（app_users.prefs.picks）をライブラリの版面にして follows に書く（--users、ログは数だけ）。
# 小分類は Wikidata の説明・種類・ジャンル・競技・機種などから決める（引いた結果は state/wd_facts.json に 30 日。お客さまの選んだものが分かるので倉庫には入れず Actions の cache に置く）。前に名前だけで決めた小分類も直す。

on:
  workflow_dispatch:
    inputs:
      compare:
        description: "店長の版面を今の規則で引き直して今の番号と比べるだけ（書かない）"
        type: boolean
        default: false
  schedule:
    - cron: "41 3 * * 1"
    - cron: "41 * * * *"
  push:
    branches: [main]
    paths: ["items.yaml", "scripts/library.py"]

permissions:
  contents: write

concurrency:
  group: library
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 店長の版面の番号を今の規則で比べる（手で compare を付けた回だけ、何も書かない）
        if: inputs.compare
        run: python scripts/library.py --compare
      - name: Wikidata の番号を引き直す（週 1 回・手で）
        if: (github.event_name == 'workflow_dispatch' && !inputs.compare) || github.event.schedule == '41 3 * * 1'
        run: |
          python scripts/library.py --refresh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add items.yaml state/log/library.json
          git diff --cached --quiet || git commit -q -m "ライブラリ：Wikidata の引き直し $(TZ=Asia/Tokyo date +'%F %H:%M')"
          for i in 1 2 3 4 5; do
            git push -q && break
            if git pull --rebase -q; then :; else git rebase --abort || true; sleep 5; fi
          done
      - if: ${{ !inputs.compare }}
        run: python scripts/library.py --push
      - name: Wikidata の引いた結果（お客さまの分、倉庫に入れない）
        if: ${{ !inputs.compare }}
        uses: actions/cache@v4
        with:
          path: state/wd_facts.json
          key: wd-facts-${{ github.run_id }}
          restore-keys: wd-facts-
      - name: お客さまの選んだものを版面にする
        if: ${{ !inputs.compare }}
        run: |
          python scripts/library.py --users
          git add state/log/library.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "ライブラリ：お客さまの版面 $(TZ=Asia/Tokyo date +'%F %H:%M')"
          for i in 1 2 3 4 5; do
            git push -q && break
            if git pull --rebase -q; then :; else git rebase --abort || true; sleep 5; fi
          done
