name: 質問と報告を Discord へ

# 会話の Claude がユーザーに選んでもらう質問を出したら @ 付きで知らせ、返事がなければ繰り返す。2 時間ごとの「いま何をしているか」も送る
# （harness/ask_remind.py、2026-10-24 用户定的）。会話の Claude が workflow_dispatch で ask / clear / say を送る。待ちの記録は Actions の cache に。

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      cmd:
        description: "ask（質問を出した）・clear（答えた）・say（報告）"
        required: true
        default: say
      text:
        description: "質問の要約・報告の文"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ask-remind
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_MENTION: ${{ vars.DISCORD_MENTION }}   # <@あなたの Discord の番号>。設定がなければ @here
      CMD: ${{ inputs.cmd || 'tick' }}
      TEXT: ${{ inputs.text }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          sparse-checkout: harness
      - uses: actions/cache/restore@v4
        with:
          path: .ask_state.json
          key: ask-state-${{ github.run_id }}
          restore-keys: ask-state-
      - run: python harness/ask_remind.py .ask_state.json "$CMD" "$TEXT"
      - uses: actions/cache/save@v4
        with:
          path: .ask_state.json
          key: ask-state-${{ github.run_id }}
